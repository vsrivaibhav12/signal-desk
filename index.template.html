    const factors = (x.factors || []).map(f => `<span class="dchip ${f.ok ? "ok" : "no"}">${esc(f.text)}</span>`).join("");
    const idea = i.premium ? `<p class="idea"><b>${esc(i.contract)}</b> · buy at ask ₹${inr(i.premium)} (bid ₹${inr(i.bid)}, spread ${i.spread_pct == null ? "n/a" : i.spread_pct + "%"}) · lot ${i.lot} · stop ₹${inr(i.stop)} · target ₹${inr(i.target)}<br><span class="muted">Risk ₹${inr(i.risk_per_lot, 0)} per lot · capital ₹${inr(i.capital_per_lot, 0)} · estimated costs ${i.cost_ratio == null ? "n/a" : Math.round(i.cost_ratio * 100) + "% of risk"} · depth bid ${i.bid_qty == null ? "n/a" : inr(i.bid_qty, 0)} / ask ${i.ask_qty == null ? "n/a" : inr(i.ask_qty, 0)} · OI ${i.oi == null ? "n/a" : inr(i.oi, 0)} · quote ${i.quote_age_s == null ? "timestamp unknown" : i.quote_age_s + "s old"} · expiry ${esc(i.expiry)}</span></p>`
      : i.error ? `<p class="muted">${esc(i.error)}</p>` : "";
    const verdict = take ? `<p><span class="vchip good">${side} idea worth taking</span> <span class="muted">${x.score} of 5 points</span></p>`
      : broke ? `<p><span class="vchip few">${side} only watching</span> <span class="muted">${esc((x.why_not || []).join("; "))}</span></p>` : "";
    return `<div class="card opt${take ? " take" : ""}"><div class="mover-top"><b>${esc(x.name)}</b><span><span class="num">${x.spot ? inr(x.spot) : ""}</span> ${x.change == null ? "" : `<span class="${cls(x.change)}">${x.change >= 0 ? "+" : "−"}${Math.abs(x.change).toFixed(2)}%</span>`}</span></div>
      <p class="muted" style="margin:2px 0 6px">${esc(x.state)}${x.range_high ? ` · range ${inr(x.range_low)} to ${inr(x.range_high)}` : ""}</p>
      ${broke || x.side && x.score >= 3 ? `<div class="dchips" style="padding:0 0 8px">${factors}</div>` : ""}${verdict}${idea}
      ${(x.warnings || []).map(w => `<p class="alarm" style="margin:6px 0 0">${esc(w)}</p>`).join("")}</div>`;
  };
  const heavy = (o.heavy || []).length ? `<p class="note">Index heavyweights reporting: ${o.heavy.map(esc).join(", ")}. Index moves can be sharper than usual.</p>` : "";
  return sec("options", "Calls and puts", `as of ${hhmm(o.asof)}`, `${filters}${visible.length ? visible.map(card).join("") : `<div class="empty">No option ideas in this filter. Choose All to see every index.</div>`}${heavy}
    <p class="note">An index scores up to 5 points: broke the opening range, above (or below) VWAP, 9 EMA against 21 EMA, up (or down) on the day, and near the top (or bottom) of the day's range. 4 or more, inside the entry window, with costs that fit, is worth taking. These are paper ideas for judging the rules; the tool places no orders.</p>`);
}

function replayBlock() {
  const r = state.rp;
  if (!r) return `<div class="empty">The research replay has not been run yet. Open the Actions tab, choose Research replay, and press Run workflow.</div>`;
  const pct = x => x == null ? "n/a" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "R";
  const ci = b => b && b.ci_avg_r ? `${pct(b.ci_avg_r[0])} to ${pct(b.ci_avg_r[1])}` : "n/a";
  const cell = b => b && b.n ? `<td class="num ${cls(b.avg_r)}">${pct(b.avg_r)}<small>${b.n} trades</small></td>` : `<td class="muted">none</td>`;
  const rows = r.experiments.map(e => `<tr><td><b>${esc(e.name)}</b><small>${esc(e.desc)}</small></td>${cell(e.all)}<td>${ci(e.all)}</td>${cell(e.development)}${cell(e.validation)}</tr>`).join("");
  const cs = (r.cost_sensitivity || []).filter(x => x.n).map(x => `${x.cost_factor}× costs: <b class="${cls(x.avg_r)}">${pct(x.avg_r)}</b>`).join(" · ");
  const w = r.watchlist_load || {};
  return `<p class="note">${esc(r.period.from)} to ${esc(r.period.to)}: ${r.period.sessions} sessions after warm-up, source ${esc(r.source || "")}. Each row adds one piece of the live decision process, using only what was known at the time. <b>R</b> is the amount risked on a trade; every number is after costs.</p>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>What is included</th><th>All sessions</th><th>95% range</th><th>Development</th><th>Validation</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <p class="note"><b>How costs change the full system:</b> ${cs}. The gap between no costs and full costs is what the broker, taxes and slippage take.</p>
    ${w.avg_shares_scanned_per_candle ? `<p class="note"><b>Load:</b> the watchlist scanned about ${w.avg_shares_scanned_per_candle} of ${w.all_shares} shares per 5-minute candle (${w.share_of_universe}%).</p>` : ""}
    <p class="note"><b>Holdout:</b> ${esc(r.holdout.note)}</p>
    <ul class="why">${r.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
}

function archetypesBlock(r) {
  const A = r.archetypes;
  if (!A) return "";
  const sg = (x, u) => x == null ? "n/a" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(u === "pct" ? 2 : 2) + (u === "pct" ? "%" : "R");
  const rowFor = (e, plc) => {
    const u = e.unit, a = e.all || {}, k = u === "pct" ? "avg_pct" : "avg_r";
    const pb = plc && plc[e.id] && plc[e.id].placebo;
    const beat = plc && plc[e.id] ? (plc[e.id].beats_random ? "beats random entry" : "does not beat random") : "";
    return `<tr><td><b>${esc(e.name)}</b></td><td class="num ${cls(a[k])}">${sg(a[k], u)}<small>${a.n || 0} trades</small></td><td class="num">${a.win_rate != null ? a.win_rate + "%" : ""}</td><td class="num">${e.development ? sg(e.development[k], u) : ""}</td><td class="num">${e.validation ? sg(e.validation[k], u) : ""}</td><td>${pb ? sg(pb.mean, u) + "<small>" + beat + "</small>" : ""}</td></tr>`;
  };
  const fam = (f) => { const F = A[f] || {}; const plc = Object.fromEntries((F.placebo || []).map(x => [x.id, x])); return (F.experiments || []).map(e => rowFor(e, plc)).join(""); };
  const rows = fam("mean_reversion") + fam("burst") + fam("episodic") + fam("exits");
  const rp = A.rolling_profit_factor || {};
  const rpRows = Object.entries(rp).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${Math.round(v.share_above_bar * 100)}%</td><td class="num">${v.median_pf}</td><td class="num">${v.worst_pf}</td></tr>`).join("");
  return `<p class="subhead">The "Market research" document, tested</p>
    <p class="note">An AI-written report named five setup types and some pass marks. Each was written down as an exact rule first (engine/archetypes.py) and run on the survivor-free universe with costs. Rows are average per trade after costs.</p>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Test</th><th>All</th><th>Win rate</th><th>Development</th><th>Validation</th><th>Random entry</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    ${rpRows ? `<div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Share of 12-month windows with profit factor above ${(rp.tight && rp.tight.bar) || 1.25} (the report wanted 75%)</th><th>Above bar</th><th>Median</th><th>Worst</th></tr></thead><tbody>${rpRows}</tbody></table></div></div>` : ""}`;
}

function playbookBlock(r) {
  const P = r.playbook;
  if (!P) return "";
  const pct = x => x == null ? "n/a" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "R";
  const cell = b => b && b.n ? `<td class="num ${cls(b.avg_r)}">${pct(b.avg_r)}<small>${b.n} trades</small></td>` : `<td class="muted">none</td>`;
  const plc = Object.fromEntries((P.placebo || []).map(x => [x.id, x]));
  const rows = P.experiments.map(e => { const x = plc[e.id], pb = x && x.placebo; return `<tr><td><b>${esc(e.name)}</b></td>${cell(e.all)}${cell(e.development)}${cell(e.validation)}<td>${pb ? `${pct(pb.mean)}<small>${x.beats_random ? "breakout beats random" : "does not beat random"}</small>` : ""}</td></tr>`; }).join("");
  const sz = (P.sizing && P.sizing.ctx_rs_t) || [];
  const szRows = sz.map(x => `<tr><td>${x.risk_pct}% of equity per trade</td><td class="num ${cls(x.cagr_pct)}">${x.cagr_pct}%</td><td class="num">${x.max_drawdown_pct}%</td><td class="num">${x.development ? x.development.cagr_pct + "%" : ""}</td><td class="num">${x.validation ? x.validation.cagr_pct + "%" : ""}</td></tr>`).join("");
  const bg = P.bear_gauge || {};
  return `<p class="subhead">The Leader Playbook ideas, tested</p>
    <p class="note">From study notes of a trader's podcast: a tight pivot breakout, a pullback to the 21-day average, and a partial-profit exit, all on relative-strength leaders in an uptrend. Rules fixed in advance (engine/playbook.py). 25 tests have now been looked at, so a lone near-miss means little.</p>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Test</th><th>All</th><th>Development</th><th>Validation</th><th>Random entry, same shares</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <p class="note"><b>Bear gauge</b> (under ${Math.round((bg.threshold || 0.2) * 100)}% of shares above their 200-day average): it fired on ${bg.days_flagged} of ${bg.days_measured} days, so it barely changes anything in the 200 most traded shares.</p>
    ${szRows ? `<div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Relative-strength tight-base breakout, 3R target: position size</th><th>Per year</th><th>Worst fall</th><th>2017 to Apr 2023</th><th>Apr 2023 to Jan 2025</th></tr></thead><tbody>${szRows}</tbody></table></div></div>
    <p class="note">Halving the risk about halves both the return and the fall, so sizing changes the ride, not the quality. Nifty itself: ${(r.books && r.books.nifty_buy_hold) ? r.books.nifty_buy_hold.cagr_pct + "% a year with a " + r.books.nifty_buy_hold.max_drawdown_pct + "% fall" : ""}.</p>` : ""}`;
}

function ctxBlock(r) {
  const pct = x => x == null ? "n/a" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "R";
  const base = Object.fromEntries(r.experiments.map(e => [e.id, e]));
  const rows = [["tight", base.tight, base.tight_t], ...r.context_experiments.filter(e => e.exit === "trail").map(e => [e.id, e, r.context_experiments.find(x => x.id === e.id + "_t")])];
  const beats = id => { const p = r.placebo.find(x => x.id === id); return p && p.placebo ? (p.breakout_beats_random ? "yes" : "no") : ""; };
  const ctxRows = rows.map(([id, a, b]) => `<tr><td><b>${esc(a.name)}</b></td><td class="num ${cls(a.all.avg_r)}">${pct(a.all.avg_r)}<small>${a.all.n} trades · random ${beats(id) || "n/a"}</small></td><td class="num ${cls(b.all.avg_r)}">${pct(b.all.avg_r)}<small>${b.all.n} trades · random ${beats(id + "_t") || "n/a"}</small></td></tr>`).join("");
  const names = {mom_classic: "Strongest 20: 12-month return, skipping the last month", mom_classic_regime: "... and cash when Nifty is below its 200-day", mom_ms: "Strongest 20: weighted 3/6/9/12-month score", mom_ms_regime: "... and cash when Nifty is below its 200-day", equal_weight: "All members, equal weight", nifty_trend_hold: "Nifty, held only above its 200-day average", nifty_buy_hold: "Nifty buy and hold"};
  const b = r.books || {};
  const bookRows = Object.keys(names).filter(k => b[k]).map(k => `<tr><td>${esc(names[k])}</td><td class="num ${cls(b[k].cagr_pct)}">${b[k].cagr_pct}%</td><td class="num">${b[k].max_drawdown_pct}%</td><td class="num">${b[k].development ? b[k].development.cagr_pct + "%" : ""}</td><td class="num">${b[k].validation ? b[k].validation.cagr_pct + "%" : ""}</td></tr>`).join("");
  return `<p class="subhead">Market context: does relative strength or breadth help?</p>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Tight-base breakout, plus</th><th>20-day exit</th><th>3R target</th></tr></thead><tbody>${ctxRows}</tbody></table></div></div>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Portfolio (monthly, equal weight, costs paid)</th><th>Per year</th><th>Worst fall</th><th>2017 to Apr 2023</th><th>Apr 2023 to Jan 2025</th></tr></thead><tbody>${bookRows}</tbody></table></div></div>
    <p class="note">Relative strength is the percentile of the weighted 3/6/9/12-month return among the 200 most traded shares on that date. Breadth is the share of them above their 50-day average. Sector rotation is not tested: no free, point-in-time sector classification exists.</p>`;
}

function dailyBlock() {
  const r = state.dr;
  if (!r) return `<div class="empty">The daily research has not been run yet. Open the Actions tab, choose Daily research, and press Run workflow.</div>`;
  const pct = x => x == null ? "n/a" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "R";
  const ci = b => b && b.ci_avg_r ? `${pct(b.ci_avg_r[0])} to ${pct(b.ci_avg_r[1])}` : "n/a";
  const cell = b => b && b.n ? `<td class="num ${cls(b.avg_r)}">${pct(b.avg_r)}<small>${b.n} trades</small></td>` : `<td class="muted">none</td>`;
  const table = rule => `<div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>${rule === "trail" ? "Exit: 20-day average" : "Exit: 3R target or 60 days"}</th><th>All</th><th>95% range</th><th>Development</th><th>Validation</th></tr></thead><tbody>${r.experiments.filter(e => e.exit === rule).map(e => `<tr><td><b>${esc(e.name.replace(" (3R target)", ""))}</b></td>${cell(e.all)}<td>${ci(e.all)}</td>${cell(e.development)}${cell(e.validation)}</tr>`).join("")}</tbody></table></div></div>`;
  const pl = r.placebo.filter(p => p.placebo).map(p => `<tr><td><b>${esc(p.id)}</b> (${p.exit === "trail" ? "20-day exit" : "3R target"})</td><td class="num ${cls(p.real.avg_r)}">${pct(p.real.avg_r)}</td><td class="num">${pct(p.placebo.mean)}<small>${pct(p.placebo.ci[0])} to ${pct(p.placebo.ci[1])}</small></td><td>${p.breakout_beats_random ? "<b>yes</b>" : "no"}</td></tr>`).join("");
  const pf = r.portfolio || {}, nb = r.nifty_buy_and_hold || {}, sp = r.survivor_probe || {}, c = r.concentration_full_system || {};
  const yr = Object.entries(r.by_year_full_system || {}).map(([y, b]) => `${y}: <b class="${cls(b.avg_r)}">${pct(b.avg_r)}</b> (${b.n})`).join(" · ");
  const surv = (r.universe || "").includes("survivors only");
  const ended = r.ended_shares || {};
  return `<p class="note">${esc(r.period.from)} to ${esc(r.period.to)}, ${r.period.shares} shares, daily prices. <b>Universe:</b> ${esc(r.universe || "today's Nifty 200")}. <b>Rules fixed before any result was seen; nothing tuned.</b> R is the 8% stop. Every number is after an estimated 0.40% round-trip cost.</p>
    ${table("trail")}${table("target")}
    ${r.context_experiments ? ctxBlock(r) : ""}
    ${playbookBlock(r)}
    ${archetypesBlock(r)}
    <p class="subhead">Does the breakout beat entering at random?</p>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><thead><tr><th>Test</th><th>Breakout</th><th>Random entry, same shares, same exit</th><th>Beats random?</th></tr></thead><tbody>${pl}</tbody></table></div></div>
    <p class="note">${pf.full_t ? `<b>As a portfolio</b> (1.5% risked per trade, 5 positions): the 3R-target version grew ${pf.full_t.cagr_pct}% a year with a ${pf.full_t.max_drawdown_pct}% drawdown; the 20-day-exit version ${pf.full.cagr_pct}% with ${pf.full.max_drawdown_pct}%. Nifty itself: ${nb.cagr_pct}% with ${nb.max_drawdown_pct}%.` : ""}</p>
    <p class="note"><b>By year (full system, 20-day exit):</b> ${yr}</p>
    ${c.total_r ? `<p class="note"><b>Concentration:</b> the 10 best trades made ${c.top10_trades_r}R of the ${c.total_r}R total; without them the average is ${pct(c.avg_r_without_top10)}. The 5 best shares made ${c.top5_shares_r}R.</p>` : ""}
    ${!surv && ended.shares_that_stopped_trading ? `<p class="note"><b>No survivorship filter:</b> ${ended.shares_that_stopped_trading} of the ${r.period.shares} shares later stopped trading (delisted, merged or bankrupt); a trade open when one stopped is closed at its last price. ${ended.trades_closed_at_delisting && ended.trades_closed_at_delisting.n ? `There were ${ended.trades_closed_at_delisting.n} such trades in the full system, averaging ${pct(ended.trades_closed_at_delisting.avg_r)}.` : ""}</p>` : ""}
    ${surv && sp.shares ? `<p class="alarm" style="margin:8px 0"><b>Survivorship:</b> the shares in today's index grew ${sp.average_share_cagr_pct}% a year on average (median ${sp.median_share_cagr_pct}%) over this period, against ${sp.nifty_cagr_pct}% for Nifty. The list is tilted towards past winners, which flatters any method that buys strength. Treat the results as an upper bound.</p>` : ""}
    <p class="note"><b>Holdout:</b> ${esc(r.holdout.note)}</p>
    <ul class="why">${r.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
}

function healthBlock() {
  const h = state.sl && state.sl.health, st = state.sl && state.sl.status, api = state.sl && state.sl.api;
  if (!h) return `<div class="empty">Data health appears after the first 5-minute pass.</div>`;
  const tone = x => ["fresh", "ok", "complete"].includes(x) ? "good" : x === "invalid" ? "bad" : ["partial", "slowed"].includes(x) ? "mixed" : ["stale", "missing", "unavailable"].includes(x) ? "few" : "";
  const calls = st && st.cycle_calls != null ? `<p class="note">The last 5-minute pass made <b>${st.cycle_calls}</b> broker requests in ${st.cycle_seconds}s.${api ? ` This run: ${api.total} requests in all (${Object.entries(api.by_method).map(([m, x]) => `${esc(m)} ${x.calls}${x.refused ? `, ${x.refused} refused` : ""}${x.errors ? `, ${x.errors} failed` : ""}`).join("; ")}).` : ""}</p>` : "";
  return `<p>Decision: <span class="vchip ${h.decision === "OK" ? "good" : "few"}">${h.decision}</span> <span class="muted">${h.decision === "OK" ? "every input the decisions need is recent" : "not recent: " + esc((h.blocking || []).join(", ")) + ". New ideas are only watched until it clears."}</span></p>
    <div class="card" style="padding:6px 0"><div class="scroll"><table class="watch"><tbody>${h.items.map(x => `<tr><td><b>${esc(x.name)}</b></td><td><span class="vchip ${tone(x.status)}">${esc(x.status)}</span></td><td class="muted">${esc(x.detail)}</td></tr>`).join("")}</tbody></table></div></div>${calls}`;
}

function overviewSection(lead, takeOpen, optIdeas, open, watchCount, mineOpen, hd) {
  const health = state.sl && state.sl.health, decision = health ? health.decision : "UNKNOWN";
  const status = decision === "OK" ? "Data checks passing" : decision === "WATCH" ? "Data quality: WATCH" : "Data health pending";
  const statusTone = decision === "OK" ? "good" : decision === "WATCH" ? "warn" : "neutral";
  const totalIdeas = takeOpen.length + optIdeas;
  const risk = exposure(open).risk, pnl = exposure(open).pnl;
  const wl = (state.sl && state.sl.watchlist) || [];
  const q = state.sl && state.sl.scan && state.sl.scan.quality;
  const coverage = q && q.expected ? Math.round(q.fresh / q.expected * 100) : null;
  const regime = state.sl && state.sl.leaders, breadth = regime && regime.breadth;
  const posture = breadth && regime.ok ? (breadth.bear_phase ? "Defensive" : breadth.above200 >= .6 && breadth.above50 >= .5 ? "Supportive" : "Mixed") : "Not yet confirmed";
  const engine = hd.running ? "ENGINE RUNNING" : hd.waitingLogin ? "LOGIN REQUIRED" : hd.missing ? "ENGINE CHECK-IN MISSED" : "ENGINE RESTING";
  const action = totalIdeas ? `${totalIdeas} idea${totalIdeas === 1 ? "" : "s"} passed the current rules` : "No setup has passed every required check";
  return `<section id="overview" class="overview">
    <div class="overview-main">
      <div class="eyebrow">INDIA MARKETS <span>·</span> PAPER-TRADING DECISION SYSTEM</div>
      <div class="overview-title">Decision cockpit</div>
      <p class="overview-copy">${esc(lead)} ${watchCount ? `${watchCount} open signal${watchCount === 1 ? "" : "s"} remain WATCH.` : "Review the market, data quality and open risk before acting."}</p>
      <div class="decision-row"><span class="status-dot ${statusTone}"></span><b>${esc(status)}</b><span class="decision-divider">·</span><span>${esc(engine)}</span></div>
      ${decision === "WATCH" ? `<div class="overview-blockers"><b>Decision blocked by:</b> ${esc((health.blocking || []).join(", ") || "data-quality checks")} <button data-jump="more">View diagnostics →</button></div>` : ""}
      <div class="overview-actions"><button class="primary-action" data-jump="${totalIdeas ? (takeOpen.length ? "take" : "options") : "watchlist"}">${totalIdeas ? "Review actionable ideas" : "Review watchlist"} <span>→</span></button><button class="secondary-action" data-jump="market">Market pulse</button></div>
    </div>
    <div class="overview-side">
      <div class="side-stat"><span>Market posture</span><b>${posture}</b><small>Daily breadth · descriptive only</small></div>
      <div class="side-stat"><span>Quote coverage</span><b>${coverage == null ? "—" : coverage + "%"}</b><small>${q ? `${q.fresh} of ${q.expected} fresh quotes` : "Waiting for the universe scan"}</small></div>
      <div class="side-stat"><span>Strategy universe</span><b>${wl.length}</b><small>Shares currently in play</small></div>
    </div>
    <div class="kpi-grid">
      <button class="kpi" data-jump="take"><span>Share setups</span><b>${takeOpen.length}</b><small>Passed all current gates</small></button>
      <button class="kpi" data-jump="options"><span>Options ideas</span><b>${optIdeas}</b><small>Passed contract checks</small></button>
      <button class="kpi" data-jump="mine"><span>Open positions</span><b>${open.length}</b><small>${mineOpen} marked as yours</small></button>
      <button class="kpi" data-jump="mine"><span>Open risk budget</span><b>${rupee(risk)}</b><small>Recorded initial risk</small></button>
      <button class="kpi" data-jump="mine"><span>Open P&amp;L</span><b class="${cls(pnl)}">${signed(pnl)}</b><small>Model mark, not broker statement</small></button>
    </div>
  </section>`;
}

function render() {
  const keep = document.querySelector(".sheet-body"), sy = keep ? keep.scrollTop : 0;
  const hd = renderHeader(); applyPreferences();
  if (!state.feed && !state.sl && !state.sb) {
    $("app").innerHTML = state.error === "none-yet"
      ? `<p class="lead">Nothing to show yet.</p><p class="sublead">The engine has not run for the first time. Open your GitHub page, go to Actions, choose Trade engine, and press Run workflow. This page fills in a minute after it starts.</p>`
      : `<p class="lead">${state.error === "unreachable" ? "Could not reach the trade data." : "Loading…"}</p><p class="sublead">${state.error === "unreachable" ? "Check your internet connection. This page tries again by itself every 2 minutes." : ""}</p>`;
    $("sheet").innerHTML = "";
    freshness();
    return;
  }
  ROWS.clear();
  const rows = allRows(), open = rows.filter(r => r.status === "OPEN");
  const takeOpen = open.filter(t => gradeOf(t) === "take").sort((a, b) => (a.iso < b.iso ? 1 : -1));
  const todaySl = state.sl && state.sl.date;
  const takeEnded = rows.filter(t => t.status === "CLOSED" && gradeOf(t) === "take" && t.date === (t.opt ? todayOf("options") : todaySl)).sort((a, b) => (a.iso < b.iso ? 1 : -1));
  const watchOpen = open.filter(t => gradeOf(t) !== "take");
  const S = SOURCES.map(s => srcStats(s.id)), trig = S.reduce((a, s) => a + s.today.n, 0);
  const mineOpen = open.filter(t => takenSet.has(t.id)).length;
  const optItems = (state.sl && state.sl.options_scan && state.sl.options_scan.items) || [];
  const optIdeas = optItems.filter(x => x.grade === "take").length;
  const lead = takeOpen.length || optIdeas ? `${takeOpen.length ? takeOpen.length + " share setup" + (takeOpen.length > 1 ? "s" : "") : ""}${takeOpen.length && optIdeas ? " · " : ""}${optIdeas ? optIdeas + " option idea" + (optIdeas > 1 ? "s" : "") : ""} passed the rules.` : hd.waitingLogin ? "Waiting for broker login." : hd.missing ? "The engine is not checking in." : hd.running ? "No trade currently passes every check." : "Markets are resting.";
  const genuine = ((state.sl && state.sl.movers && state.sl.movers.list) || []).filter(m => m.genuine).length;
  $("app").innerHTML = `<nav class="jump" aria-label="Sections">${NAV.map(([id, l]) => `<button class="chip" data-jump="${id}">${l}</button>`).join("")}</nav>
    ${overviewSection(lead, takeOpen, optIdeas, open, watchOpen.length, mineOpen, hd)}
    ${marketSection()}${takeSection(takeOpen, takeEnded, watchOpen.length)}${optionsSection()}${resultsSection(rows)}
    ${mineSection(rows)}${moversSection(rows)}
    <section id="more"><div class="sec-head"><h2>Research &amp; logs</h2><span class="muted" style="font-size:.88rem">Deeper evidence and diagnostics, when you need them</span></div>
      ${det("daily", "Daily research: base-and-breakout over ten years", state.dr ? `${state.dr.period.shares} shares` : "not run yet", () => dailyBlock())}
      ${det("replay", "Research replay: does the whole process have an edge?", state.rp ? `${state.rp.period.sessions} sessions` : "not run yet", () => replayBlock())}
      ${det("health", "Data health & broker diagnostics", state.sl && state.sl.health ? state.sl.health.decision : "", () => healthBlock())}
      ${det("watching", "Signals being watched, not recommended", `${watchOpen.length} open`, () => watchingBlock(watchOpen))}
      ${det("board", "Strategy scoreboard", `${SOURCES.length} strategies, backtest and live`, () => scoreboard(S))}
      ${det("portfolio", "Portfolio risk & validation", "Overlapping signals and risk limits", () => `${portfolioLiveBlock()}${state.sb ? portfolioBacktestBlock() : `<div class="empty">The strategy backtest has not reported a portfolio result yet.</div>`}`)}
      ${det("watch", "Index opening ranges", "", () => watchSection())}
      ${det("log", "Trade ledger", `${rows.length} records`, () => logSection())}
      ${det("news", "News feed", `${newsList().length} headlines`, () => newsSection())}
      ${(state.feed && state.feed.status && state.feed.status.day && state.feed.status.day.log || []).length ? det("alog", "Options desk activity log", "", () => `<ol class="timeline">${state.feed.status.day.log.slice().reverse().map(e => `<li><time>${hhmm(e.t)}</time><span>${esc(e.text)}</span></li>`).join("")}</ol>`) : ""}
      ${state.sb ? det("assume", "Backtest assumptions & limitations", "", () => `<ul class="why">${state.sb.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`) : ""}</section>`;
  $("sheet").innerHTML = sheetHtml();
  const nb = document.querySelector(".sheet-body"); if (nb) nb.scrollTop = sy;
  document.documentElement.style.overflow = state.sheet ? "hidden" : "";
  freshness(); tickCountdown();
  hydrateCharts();
}

const rerender = () => { const y = scrollY; render(); scrollTo(0, y); };

document.addEventListener("click", e => {
  const b = e.target.closest("button, tr[data-sheet], [data-close], input[data-took]");
  if (!b) return;
  if (b.dataset.close) { closeSheet(); return; }
  if (b.dataset.refresh) { refresh(); return; }
  if (b.dataset.ended) { state.showEnded = !state.showEnded; rerender(); return; }
  if (b.dataset.sheet) { openSheet(b.dataset.sheet, b.tagName === "BUTTON" ? b : null); return; }
  if (b.dataset.jump) { const el = $(b.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (b.dataset.themeToggle) { state.theme = state.theme === "auto" ? "dark" : state.theme === "dark" ? "light" : "auto"; try { localStorage.setItem("sd_theme", state.theme); } catch (_) {} applyPreferences(); return; }
  if (b.dataset.compactToggle) { state.compact = !state.compact; try { localStorage.setItem("sd_compact", state.compact ? "1" : "0"); } catch (_) {} applyPreferences(); return; }
  if (b.dataset.wlf) { state.wlFilter = b.dataset.wlf; rerender(); return; }
  if (b.dataset.optf) { state.optFilter = b.dataset.optf; rerender(); return; }
  if (b.dataset.group) { const k = b.dataset.group; state.openGroups.has(k) ? state.openGroups.delete(k) : state.openGroups.add(k); rerender(); return; }
  if (b.dataset.openall) { state.openAll = !state.openAll; rerender(); return; }
  if (b.dataset.took) { const id = b.dataset.took; takenSet.has(id) ? takenSet.delete(id) : takenSet.add(id); saveTaken(); rerender(); return; }
  if (b.dataset.copy) {
    const t = ROWS.get(b.dataset.copy); if (!t) return;
    const done = () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy order details"; }, 1800); };
    (navigator.clipboard ? navigator.clipboard.writeText(ticketText(t)).then(done) : Promise.reject()).catch(() => prompt("Copy the order details:", ticketText(t)));
    return;
  }
  if (b.dataset.lstatus) { state.logStatus = b.dataset.lstatus; state.lshown = 25; rerender(); return; }
  if (b.dataset.lperiod) { state.logPeriod = b.dataset.lperiod; state.lshown = 25; rerender(); return; }
  if (b.dataset.logcsv) { downloadLog(); return; }
  if (b.dataset.csv) { downloadSt(b.dataset.csv); return; }
  if (b.id === "btcsv") { downloadBt(); return; }
  if (b.dataset.smore) { state[b.dataset.smore] += 25; rerender(); return; }
  if (b.dataset.trade) { const id = b.dataset.trade; state.open.has(id) ? state.open.delete(id) : state.open.add(id); rerender(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) closeSheet(); });
document.addEventListener("change", e => { if (e.target.id === "logsrc") { state.logSrc = e.target.value; state.lshown = 25; rerender(); } else if (e.target.id === "wlsort") { state.wlSort = e.target.value; rerender(); } });
document.addEventListener("input", e => {
  if (e.target.id !== "logq" && e.target.id !== "wlq") return;
  const id = e.target.id, value = e.target.value, pos = e.target.selectionStart;
  if (id === "logq") { state.logQ = value; state.lshown = 25; } else state.wlQ = value;
  rerender();
  const box = $(id); if (box) { box.focus(); box.setSelectionRange(pos, pos); }
});
document.addEventListener("toggle", e => {          // remember which blocks are open, so a refresh does not close them
  const d = e.target;
  if (d.dataset && d.dataset.d) { if (d.open) state.det.add(d.dataset.d); else state.det.delete(d.dataset.d); if (d.open && !d.querySelector(".blk-body")) rerender(); }
}, true);
window.addEventListener("hashchange", () => { const s = hashSheet(); if (s !== state.sheet) { state.sheet = s; state.sshown = 25; render(); } });

function downloadBt() {
  const head = ["Date", "Market", "Direction", "Trade", "In", "Out", "Entry price", "Exit price", "Result before costs", "Costs", "Result after costs", "R", "How it ended"];
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = state.bt.trades.map(t => [t[0], t[1], t[2] === 1 ? "Buy" : "Sell", t[3], t[4], t[5], t[6], t[7], t[8], t[9], t[10], t[11], t[12]].map(q).join(","));
  const url = URL.createObjectURL(new Blob([[head.map(q).join(","), ...rows].join("\n")], { type: "text/csv" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "signal-desk-backtest-trades.csv" });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// After a Fyers login the browser lands here with a login code. Help the user hand it to the bot.
function loginHelper() {
  const code = new URLSearchParams(location.search).get("auth_code");
  if (!code) return;
  const bot = state.feed && state.feed.status && state.feed.status.bot;
  const box = document.getElementById("login");
  box.innerHTML = `<div class="login"><div class="card">
    <h2 style="margin:0 0 8px">Fyers login worked</h2>
    <p>One step left: give this login code to your Telegram bot so the tool can read prices.</p>
    <button class="big" id="copy">Copy login code</button>
    ${bot ? `<a class="big alt" href="https://t.me/${esc(bot)}">Open my Telegram bot</a>` : ""}
    <p class="muted" style="font-size:.9rem;margin-bottom:0">In Telegram, paste the code as a message and send it. The code works only for a few minutes.</p>
    <button class="big alt" id="skip">Go to the dashboard</button></div></div>`;
  document.getElementById("copy").onclick = async ev => {
    try { await navigator.clipboard.writeText(code); ev.target.textContent = "Copied. Now paste it in Telegram"; }
    catch (err) { prompt("Copy this code and paste it in Telegram:", code); }
  };
  document.getElementById("skip").onclick = () => { history.replaceState(null, "", location.pathname); box.innerHTML = ""; };
}


(async function start() {
  await load(); state.loadedAt = Date.now(); render(); loginHelper();
  if (LIVE) {
    setInterval(refresh, REFRESH_MS);
    setInterval(tickCountdown, 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.loadedAt > 60e3) refresh(); });   // catch up when you return to the tab
  }
})();
</script>
</body>
