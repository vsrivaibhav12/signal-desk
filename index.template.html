<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Desk 4.0.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E8F0; --line:#D3D9E6;
  --ink:#17203A; --muted:#566080;
  --gain:#0A7F5B; --gain-soft:#DDF3EA; --loss:#C2362B; --loss-soft:#FAE3E0;
  --live:#B97F00; --live-soft:#FBEFCF; --accent:#2B3F8C;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1427; --surface:#161E38; --sunk:#1D2747; --line:#2B3659;
    --ink:#E9EDF8; --muted:#9AA6C6;
    --gain:#43D6A4; --gain-soft:#12392F; --loss:#FF8272; --loss-soft:#44201F;
    --live:#F2BC45; --live-soft:#3D3115; --accent:#9DB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1427; --surface:#161E38; --sunk:#1D2747; --line:#2B3659;
  --ink:#E9EDF8; --muted:#9AA6C6;
  --gain:#43D6A4; --gain-soft:#12392F; --loss:#FF8272; --loss-soft:#44201F;
  --live:#F2BC45; --live-soft:#3D3115; --accent:#9DB0FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700;margin:44px 0 14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 1.15rem var(--display)}
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--gain);box-shadow:0 0 0 0 var(--gain);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--live-soft);color:var(--ink);font-size:.93rem;border:1px solid var(--live)}
.lead{font:700 clamp(1.7rem,5.2vw,2.7rem)/1.12 var(--display);margin:30px 0 4px;max-width:20ch}
.sublead{color:var(--muted);max-width:60ch;margin:0}

/* trade card with ladder */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.open-card{border-left:5px solid var(--live);margin-bottom:14px}
.open-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.open-head h3{font-size:1.2rem}
.pnl-now{font:700 1.5rem var(--display)}
.pnl-box{text-align:right}
@media (max-width:560px){.pnl-box{text-align:left}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin:16px 0 0}
.facts div{font-size:.86rem;color:var(--muted)}
.facts b{display:block;color:var(--ink);font:600 1.02rem var(--body);font-variant-numeric:tabular-nums}
.ladder{position:relative;height:62px;margin:22px 14px 6px}
.ladder .rail{position:absolute;left:0;right:0;top:10px;height:8px;border-radius:4px;background:var(--sunk)}
.ladder .fill{position:absolute;top:10px;height:8px;border-radius:4px}
.ladder .tick{position:absolute;top:4px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.ladder .tick.stop{background:var(--loss)} .ladder .tick.target{background:var(--gain)}
.ladder .lab{position:absolute;top:30px;font-size:.78rem;color:var(--muted);white-space:nowrap;transform:translateX(-50%);text-align:center;line-height:1.25}
.ladder .lab b{display:block;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.ladder .lab.first{transform:none;text-align:left} .ladder .lab.last{transform:translateX(-100%);text-align:right}
.ladder .mark{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;border:3px solid var(--surface);transform:translateX(-11px);box-shadow:0 1px 4px rgba(10,20,50,.35)}
.why{margin:16px 0 0;padding:0;list-style:none}
.why li{position:relative;padding:3px 0 3px 26px;font-size:.95rem}
.why li::before{content:"";position:absolute;left:4px;top:9px;width:10px;height:6px;border-left:2.5px solid var(--gain);border-bottom:2.5px solid var(--gain);transform:rotate(-45deg)}
.subhead{font:600 .95rem var(--body);margin:18px 0 2px}

/* today tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile.busy{border-color:var(--live);background:var(--live-soft)}
.tile.done{background:transparent}
.tile h3{font-size:1.02rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tile h3 span{font:500 .95rem var(--body);font-variant-numeric:tabular-nums}
.tile p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.tile .levels{font-size:.8rem;margin-top:8px;font-variant-numeric:tabular-nums}

/* record */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.record{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
@media (max-width:820px){.record{grid-template-columns:minmax(0,1fr)}}
.record>.card{min-width:0}
.rate{font:700 clamp(3.2rem,11vw,4.6rem)/1 var(--display)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:14px 0 8px}
.split i{display:block;height:100%} .split .w{background:var(--gain)} .split .l{background:var(--loss)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin-top:18px}
.stats div{font-size:.84rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font:600 1.1rem var(--body);font-variant-numeric:tabular-nums}
.curve svg{display:block;width:100%;height:190px}
.curve-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.total{font:700 1.7rem var(--display)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-weight:500;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0}

/* trade log */
.day-label{font:600 .92rem var(--body);color:var(--muted);margin:20px 0 8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.row>button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.pill{font:600 .78rem var(--body);padding:3px 10px;border-radius:999px;min-width:52px;text-align:center}
.pill.WIN{background:var(--gain-soft);color:var(--gain)} .pill.LOSS{background:var(--loss-soft);color:var(--loss)}
.pill.OPEN{background:var(--live-soft);color:var(--live)} .pill.FLAT{background:var(--sunk);color:var(--muted)}
.row .what{font-weight:600;min-width:0}
.row .what small{display:block;font-weight:400;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .res{text-align:right;font:700 1.02rem var(--display);font-variant-numeric:tabular-nums}
.row .res small{display:block;font:400 .8rem var(--body);color:var(--muted)}
.detail{padding:2px 16px 18px;border-top:1px solid var(--line)}
.timeline{list-style:none;margin:8px 0 0;padding:0;font-size:.92rem}
.timeline li{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:4px 0}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums}
.more{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
details.log{margin-top:40px} details.log summary{cursor:pointer;font:700 1.1rem var(--display)}

/* login helper */
.login{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{max-width:440px}
.big{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font-weight:600;font-size:1.05rem;text-align:center;text-decoration:none}
.big.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news .who{font-weight:600}
.news .tag{font:500 .76rem var(--body);padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:8px;white-space:nowrap}
.news .tag.Results{background:var(--live-soft);color:var(--live)}
.news .hl{grid-column:1/-1;font-size:.95rem}
.news .hl a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
.news .src{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.news .mv{font:600 .95rem var(--body);font-variant-numeric:tabular-nums;text-align:right}
.alarm{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--loss-soft);border:1px solid var(--loss);font-size:.95rem}
.bt-verdict{font:600 clamp(1.05rem,2.6vw,1.3rem)/1.45 var(--display);margin:0 0 16px;max-width:62ch}
.bt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px}
.bt-stats div{font-size:.84rem;color:var(--muted)}
.bt-stats b{display:block;font:700 1.5rem var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.bt-stats small{display:block;font-size:.78rem}
.bt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:14px}
.bt-grid>.card{min-width:0}
.bt-meter{position:relative;height:14px;border-radius:7px;background:var(--sunk);margin:18px 0 6px}
.bt-meter .band{position:absolute;top:0;height:100%;background:var(--line);border-radius:7px}
.bt-meter .pin{position:absolute;top:-4px;width:6px;height:22px;border-radius:3px;transform:translateX(-3px)}
.bt-meter-lab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dl{margin-top:14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px}
details.assume{margin-top:14px} details.assume summary{cursor:pointer;font:600 .98rem var(--body)}
details.assume ul{margin:10px 0 0;padding-left:20px;font-size:.92rem;color:var(--muted)} details.assume li{margin:5px 0}
footer{margin-top:44px;font-size:.84rem;color:var(--muted)}

/* strategy tabs */
.vchip{display:inline-block;font:600 .76rem var(--body);padding:2px 10px;border-radius:999px;white-space:nowrap}
.vchip.good{background:var(--gain-soft);color:var(--gain)} .vchip.mixed{background:var(--live-soft);color:var(--live)}
.vchip.bad{background:var(--loss-soft);color:var(--loss)} .vchip.few{background:var(--sunk);color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.two>.card{min-width:0}
.card h3{font-size:1.05rem;margin:0 0 6px}
.rules{margin:8px 0 0;padding-left:20px} .rules li{margin:6px 0}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;left:0;background:var(--surface)}
table.cmp td:first-child small{display:block;color:var(--muted);font-size:.78rem;white-space:normal;max-width:240px}
table.cmp tbody tr{cursor:pointer} table.cmp tbody tr:hover td{background:var(--sunk)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;margin-top:12px}
.mini div{font-size:.82rem;color:var(--muted)} .mini b{display:block;color:var(--ink);font:600 1.15rem var(--body);font-variant-numeric:tabular-nums}
.tag-s{font:600 .74rem var(--body);padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-right:8px}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.halves div{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--muted)} .halves b{display:block;font:700 1.2rem var(--display);color:var(--ink)}

/* one-page layout */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .k{font-size:.82rem;color:var(--muted)}
.kpi b{display:block;font:700 1.7rem var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:40px 0 12px}
.sec-head h2{margin:0}
.link{background:none;border:0;padding:0;font:600 .96rem var(--body);color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.zb{display:inline-block;position:relative;width:84px;height:8px;background:var(--sunk);border-radius:4px;vertical-align:middle;margin-right:8px}
.zb::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.zb i{position:absolute;top:0;height:100%;border-radius:4px}
.spark{display:block;width:84px;height:24px}
.ctl{font:inherit;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.veil{position:fixed;inset:0;background:rgba(8,14,32,.5);z-index:30}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--paper);z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(8,14,32,.3)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-title{font:700 1.35rem var(--display)}
.sheet-body{overflow:auto;padding:4px 20px 70px;-webkit-overflow-scrolling:touch;flex:1}
.sec{font:700 1.15rem var(--display);margin:30px 0 10px}
.sheet .row{background:var(--surface)}

/* trader's workflow */
.jump{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:6;background:var(--paper);margin:14px -18px 0;padding:8px 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump .chip{flex:none}
section{scroll-margin-top:62px}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mk{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:.92rem}
.mk .muted{font-size:.84rem;margin-top:2px}
.gates{display:grid;gap:8px}
.gate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.86rem}
table.watch td small{display:block;color:var(--muted);font-size:.78rem;white-space:normal;max-width:420px}
table.watch td:first-child,table.watch th:first-child{text-align:left}
.expo{display:flex;gap:6px 22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:12px;font-size:.92rem}
.pill.BUY{background:var(--gain-soft);color:var(--gain)} .pill.SELL{background:var(--loss-soft);color:var(--loss)} .pill.MIXED{background:var(--live-soft);color:var(--live)}
.row .chips{display:block;margin-top:4px}
.grp-body{padding:4px 12px 12px;border-top:1px solid var(--line);background:var(--paper)}
.grp-body .row{background:var(--surface)}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block;width:100%;min-width:660px;height:auto;margin-top:14px}
.chart-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.78rem;color:var(--muted);margin-top:2px}
.chart-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px}
.took{font-size:.9rem;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.took input{width:18px;height:18px}

/* decision-first page */
.fresh{font-size:.84rem;color:var(--muted);margin-top:8px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.fresh b{color:var(--ink)}
.fresh .chip{padding:3px 12px;font-size:.82rem}
.dchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.dchip{font-size:.78rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.dchip.ok{background:var(--gain-soft);color:var(--gain)} .dchip.no{background:var(--loss-soft);color:var(--loss)}
.take{border-left:5px solid var(--gain)}
.take-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:0 14px 12px}
.mover{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mover-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mv-pct{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.mover .dchips{padding:8px 0 0}
details.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.blk>summary{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;font:600 1rem var(--body);list-style:none;align-items:baseline}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary>span:first-child{flex:1}
details.blk>summary::after{content:"+";margin-left:4px;color:var(--muted);font-size:1.2rem}
details.blk[open]>summary::after{content:"\2212"}
.blk-body{padding:0 16px 16px}
.blk-body .sec-head{display:none}
.take .what small{white-space:normal;overflow:visible}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:8px}
.rcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rcol h3{margin:0 0 2px;font:600 1rem var(--body)} .rcol p{margin:4px 0}
.opt{padding:12px 14px;margin-bottom:10px} .opt .idea{margin:6px 0}
.opt.take{border-left:5px solid var(--gain)}


.overview-blockers{margin-top:13px;padding:9px 11px;border:1px solid var(--live);background:var(--live-soft);border-radius:9px;font-size:.78rem;color:var(--ink)}
.overview-blockers button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0 0 0 5px;font-size:inherit}

/* Signal Desk 4.0 — decision cockpit */
:root{
  --paper:#F2F5F7; --surface:#FFFFFF; --sunk:#E9EFF1; --line:#D7E0E3;
  --ink:#12252B; --muted:#5B7076; --gain:#087B60; --gain-soft:#E0F3EC;
  --loss:#B93838; --loss-soft:#FBE8E6; --live:#986600; --live-soft:#FFF2D7; --accent:#087F78;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D171B;--surface:#142228;--sunk:#1B3037;--line:#2A4249;--ink:#E7F0F1;--muted:#9CB0B4;

}}

.searchbox{display:flex;gap:8px;align-items:center;min-width:min(100%,280px);flex:1;max-width:460px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 11px;color:var(--muted)}

.watch-meta,.watch-foot{display:flex;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:.73rem;margin:8px 1px}
.table-card{padding:4px 0}

.table-card tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.watch-foot{padding-top:5px;border-top:1px solid var(--line)}
#more{margin-top:28px}
#more .sec-head{margin-top:34px}

footer{border-top:1px solid var(--line);padding-top:16px;margin-top:38px}

  .overview{grid-template-columns:1fr;gap:8px;margin-top:8px}.overview-main{padding:17px}.overview-side{grid-template-columns:repeat(3,minmax(0,1fr));padding:5px 12px;gap:10px}.side-stat{border-bottom:0;padding:8px 0}.side-stat b{font-size:1.05rem}.side-stat small{font-size:.65rem}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.kpi-grid .kpi{padding:10px 11px}.kpi-grid .kpi b{font-size:1.3rem}.kpi-grid .kpi small{font-size:.67rem}
  .jump{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.rgrid.event-grid{grid-template-columns:1fr}.breadth-grid{gap:6px}.breadth-item{padding:8px}.breadth-item span{font-size:.66rem}.breadth-item b{font-size:1rem}.posture-row{align-items:flex-start}.posture-note{max-width:100px}.watch-toolbar{align-items:stretch}.sortbox{justify-content:space-between}.sortbox select{flex:1}.searchbox{max-width:none}
}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Signal Desk <span class="brand-version">4.0.0</span></div>
    <div class="top-right"><div class="pulse" id="pulse"><span class="dot"></span><span>Loading</span></div><div class="top-actions"><button class="chip" data-theme-toggle="1" id="themeToggle" aria-label="Change dashboard theme">Theme: Auto</button><button class="chip" data-compact-toggle="1" id="compactToggle" aria-pressed="false">Compact: Off</button></div></div>
  </header>
  <div id="banner"></div>
  <div id="fresh" class="fresh"></div>
  <main id="app" aria-live="polite"></main>
  <footer>Signal Desk follows a fixed rulebook and keeps score of its own suggestions as paper trades. It never places orders. Prices can differ from what you get in your broker app, and past results do not promise future ones.</footer>
</div>
<div id="login"></div>
<div id="sheet"></div>

<script>
const DEMO = /*__DEMO__*/null;
const LIVE = location.hostname.endsWith("github.io") ||
  (location.protocol.startsWith("http") && !["localhost", "127.0.0.1", "::1"].includes(location.hostname) && !location.hostname.endsWith(".local"));
// Set to "github-username/repository-name" when using a custom domain or a user-site root URL.
const DATA_REPOSITORY = "";
const dataRepository = () => {
  if (DATA_REPOSITORY && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(DATA_REPOSITORY)) return DATA_REPOSITORY;
  const owner = location.hostname.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0] || "";
  return owner && repo ? `${owner}/${repo}` : "";
};
const BT_DEMO = /*__BT__*/null;
const STRATS = /*__STRATS__*/[];
const SB_DEMO = /*__SB__*/null;
const RP_DEMO = /*__RP__*/null;
const DR_DEMO = /*__DR__*/null;
const SL_DEMO = /*__SL__*/null;

// The original options rulebook is just one more strategy: same signal idea (a breakout from the opening range),
// expressed as an option purchase instead of shares or futures.
const OPT = { id: "options", name: "Options desk", source: "Original rulebook",
  best_for: "Index, commodity and stock options on days that trend from the open.",
  risk: "Buying options pays time decay and the bid-ask gap on every trade, and its backtest has to estimate option prices, which flatters it.",
  rules: ["Mark the high and low of the opening range: the first 30 minutes (15 for stocks, 6:00 to 6:30 pm for commodities).",
    "Trade only with the trend: price above both VWAP and yesterday's close for calls, below both for puts.",
    "Enter when a 5-minute candle closes outside the range, buying the at-the-money option (next week's on expiry day).",
    "Stop: the option falls 25 to 30%, or price closes back past the middle of the range. Target: the range height beyond the breakout.",
    "Leave early if two candles close back inside the range or price crosses VWAP the wrong way. Everything closes by 2:45 pm."],
  window: ["09:45", "11:30"], exit_by: "14:45" };
const SOURCES = [OPT, ...STRATS];
const srcMeta = id => SOURCES.find(s => s.id === id) || { id, name: id, rules: [], window: ["09:15", "15:15"], exit_by: "15:15" };
const hashSheet = () => { const m = location.hash.match(/^#s=([\w]+)/); return m && SOURCES.some(s => s.id === m[1]) ? m[1] : null; };
const state = { feed: null, bt: null, btAt: 0, sb: null, sbAt: 0, sl: null, slAt: 0, slError: false, error: null,
  open: new Set(), openGroups: new Set(), lshown: 25, sshown: 25, openAll: false, sheet: hashSheet(), sheetFrom: null,
  logSrc: "all", logStatus: "all", logPeriod: "all", logQ: "", charts: {}, det: new Set(), loadedAt: 0, loading: false, showEnded: false,
  wlQ: "", wlFilter: "all", wlSort: "priority", optFilter: "all", theme: (() => { try { return localStorage.getItem("sd_theme") || "auto"; } catch (_) { return "auto"; } })(),
  compact: (() => { try { return localStorage.getItem("sd_compact") === "1"; } catch (_) { return false; } })() };
const REFRESH_MS = 120000;                 // the page re-reads the data every 2 minutes
let INNER = false;                         // while true, a section returns only its content (used inside the collapsed blocks)
const $ = id => document.getElementById(id);
const ROWS = new Map();           // trade id -> trade, filled while rendering, so a chart can find its stop and target
// "I took this" marks live in this browser only (the tool itself never places orders)
const takenSet = (() => { try { return new Set(JSON.parse(localStorage.getItem("sd_taken") || "[]")); } catch (e) { return new Set(); } })();
const saveTaken = () => { try { localStorage.setItem("sd_taken", JSON.stringify([...takenSet].slice(-500))); } catch (e) { /* private window */ } };
function applyPreferences() {
  if (state.theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = state.theme;
  document.body.classList.toggle("compact", !!state.compact);
  const theme = $("themeToggle"), compact = $("compactToggle");
  if (theme) theme.textContent = `Theme: ${state.theme[0].toUpperCase()}${state.theme.slice(1)}`;
  if (compact) { compact.textContent = `Compact: ${state.compact ? "On" : "Off"}`; compact.setAttribute("aria-pressed", state.compact ? "true" : "false"); }
}

const inr = (x, d = 2) => Number(x).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const rupee = x => (x < 0 ? "−" : "") + "₹" + inr(Math.abs(x), Math.abs(x) >= 1000 ? 0 : 2);
const signed = x => (x > 0 ? "+" : x < 0 ? "−" : "") + "₹" + inr(Math.abs(x), Math.abs(x) >= 1000 ? 0 : 2);
const cls = x => (x > 0 ? "gain" : x < 0 ? "loss" : "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function safeHttpUrl(value) {
  try { const u = new URL(String(value || ""), location.href); return ["http:", "https:"].includes(u.protocol) ? u.href : ""; }
  catch (_) { return ""; }
}
// Times in the feed are already India time, so read the clock straight from the text.
const hhmm = iso => { if (!iso) return ""; let h = +iso.slice(11, 13), m = iso.slice(14, 16); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}:${m} ${ap}`; };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayText = d => { const dt = new Date(d + "T00:00:00"); return `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()]}, ${+d.slice(8)} ${MONTHS[+d.slice(5, 7) - 1]}`; };
const clock24 = t => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "pm" : "am"}`; };


async function loadBt() {
  if (!LIVE) { state.bt = BT_DEMO; return; }
  if (Date.now() - state.btAt < 15 * 60e3) return;
  state.btAt = Date.now();
  const base = dataBase();
  if (!base) { state.error = "unreachable"; return; }
  try {
    const r = await fetch(`${base}backtest.json?t=${Math.floor(Date.now() / 6e5)}`);
    if (r.ok) { const j = await r.json(); if (j.schema === 3) state.bt = j; }
  } catch (e) { /* the section simply stays empty */ }
}


const dataBase = () => {
  if (!LIVE) return "tests/";
  const repo = dataRepository();
  return repo ? `https://raw.githubusercontent.com/${repo}/data/` : "";
};

async function loadStrat() {
  if (!LIVE) { state.sb = SB_DEMO; state.sl = SL_DEMO; state.rp = RP_DEMO; state.dr = DR_DEMO; return; }
  const base = dataBase();
  if (Date.now() - state.sbAt > 15 * 60e3) {
    state.sbAt = Date.now();
    try { const r = await fetch(`${base}strategies_backtest.json?t=${Math.floor(Date.now() / 6e5)}`); if (r.ok) { const j = await r.json(); if (j.schema === 3) state.sb = j; } } catch (e) { /* stays empty */ }
  }
  if (Date.now() - (state.rpAt || 0) > 15 * 60e3) {
    state.rpAt = Date.now();
    try { const r = await fetch(`${base}replay.json?t=${Math.floor(Date.now() / 6e5)}`); if (r.ok) { const j = await r.json(); if (j.schema === 3) state.rp = j; } } catch (e) { /* stays empty */ }
  }
  if (Date.now() - (state.drAt || 0) > 15 * 60e3) {
    state.drAt = Date.now();
    try { const r = await fetch(`${base}daily_research.json?t=${Math.floor(Date.now() / 6e5)}`); if (r.ok) { const j = await r.json(); if (j.schema === 3) state.dr = j; } } catch (e) { /* stays empty */ }
  }
  {
    state.slAt = Date.now();
    try { const r = await fetch(`${base}strategies.json?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j.schema === 3) { state.sl = j; state.slError = false; } } } catch (e) { state.slError = true; }
  }
}

async function loadFeed() {
  if (!LIVE) { state.feed = DEMO; return; }
  const repository = dataRepository();
  if (!repository) { state.error = "unreachable"; return; }
  const tries = [
    [`https://api.github.com/repos/${repository}/contents/feed.json?ref=data`, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" }],
    [`https://raw.githubusercontent.com/${repository}/data/feed.json?t=${Date.now()}`, { cache: "no-store" }],
  ];
  let missing = false;
  for (const [url, opt] of tries) {
    try {
      const r = await fetch(url, opt);
      if (r.ok) { state.feed = await r.json(); state.error = null; return; }
      if (r.status === 404) missing = true;
    } catch (e) { /* try the next address */ }
  }
  if (!state.feed) state.error = missing ? "none-yet" : "unreachable";
}

async function load() { await Promise.all([loadBt(), loadStrat(), loadFeed()]); }

function ladder(t) {
  const stop = t.stop_underlying, target = t.target_underlying, entry = t.underlying_entry;
  const now = t.underlying_last ?? entry;
  const pos = x => Math.max(-2, Math.min(102, (x - stop) / (target - stop) * 100));
  const pe = pos(entry), pn = pos(now);
  const good = pn >= pe;
  const lo = Math.max(0, Math.min(pe, pn)), hi = Math.min(100, Math.max(pe, pn));
  const closed = t.status === "CLOSED";
  const markColor = closed ? (t.result === "WIN" ? "var(--gain)" : t.result === "LOSS" ? "var(--loss)" : "var(--muted)") : "var(--live)";
  return `<div class="ladder" role="img" aria-label="Stop ${inr(stop)}, entry ${inr(entry)}, target ${inr(target)}, ${closed ? "ended" : "now"} at ${inr(now)}">
    <div class="rail"></div>
    <div class="fill" style="left:${lo}%;width:${hi - lo}%;background:${good ? "var(--gain)" : "var(--loss)"}"></div>
    <div class="tick stop" style="left:0"></div><div class="tick" style="left:${pe}%"></div><div class="tick target" style="left:100%"></div>
    <div class="mark" style="left:${Math.max(0, Math.min(100, pn))}%;background:${markColor}"></div>
    <div class="lab first" style="left:0">Stop<b>${inr(stop)}</b></div>
    <div class="lab" style="left:${Math.max(22, Math.min(78, pe))}%">Entry<b>${inr(entry)}</b></div>
    <div class="lab last" style="left:100%">${esc(t.target_label || "Target")}<b>${inr(target)}</b></div>
  </div>`;
}


function tile(x) {
  const levels = x.range_high ? `<div class="levels muted">Range ${inr(x.range_low)} to ${inr(x.range_high)}${x.vwap ? `<br>Average price line ${inr(x.vwap)}` : ""}${x.prev_close ? `<br>Yesterday’s close ${inr(x.prev_close)}` : ""}</div>` : "";
  return `<div class="tile ${x.in_trade ? "busy" : x.done ? "done" : ""}">
    <h3>${esc(x.name)}${x.price ? `<span>${inr(x.price)}</span>` : ""}</h3>
    <p>${esc(x.note || "Waiting")}</p>${levels}</div>`;
}

  return `<div class="row take"><button data-trade="${esc(t.id)}" aria-expanded="${isOpen}">

      <span class="what"><span class="tag-s">${esc(srcMeta(t.sid).name)}</span>${t.opt && t.quoteStatus === "STALE" ? `<span class="tag-s" style="background:var(--loss-soft);color:var(--loss)">QUOTE STALE</span>` : ""}${takenSet.has(t.id) ? `<span class="tag-s" style="background:var(--gain-soft);color:var(--gain)">Taken</span>` : ""}${nw ? `<span class="tag-s" style="background:var(--live-soft);color:var(--live)" title="${esc(nw.title)}">In the news: ${esc(nw.tag)}</span>` : ""}${t.opt ? esc(t.headline) : esc(t.name)}
        <small>${t.status === "OPEN" ? "Triggered" : "Ended"} ${clock24(t.inT)} · quantity ${t.opt ? (t.kind === "option" ? t.lots + " lot" + (t.lots > 1 ? "s" : "") : inr(t.qty)) : inr(t.qty)} · entry ₹${inr(t.entry)} · stop ${t.opt && t.stopPrice ? "₹" + inr(t.stopPrice) + " (option)" : "₹" + inr(t.stop)}${t.target ? " · target ₹" + inr(t.target) : " · no fixed target"} · risk ${rupee(t.risk)}${t.opt && t.quoteStatus === "STALE" ? " · premium quote stale; stop unverified" : ""}</small></span>
      <span class="res ${cls(pnl)}">${signed(pnl)}<small>${t.opt && t.quoteStatus === "STALE" ? "stale mark" : t.status === "OPEN" ? "so far" : "ended"}</small></span></button>
    ${decChips(t)}
    <div class="take-actions"><button class="chip" data-copy="${esc(t.id)}">Copy order details</button>
      <label class="took"><input type="checkbox" data-took="${esc(t.id)}" ${takenSet.has(t.id) ? "checked" : ""}> I took this trade</label></div>
    ${isOpen ? rowDetail(t, true) : ""}</div>`;
}

/* ───────────── trade charts ───────────── */
async function getCharts(src, sid) {
  const key = `${src}|${sid}`, c = state.charts[key], ttl = src === "live" ? 150e3 : 3600e3;
  if (c && c.data && Date.now() - c.at < ttl) return c.data;
  if (c && c.pending) return c.pending;
  const stamp = src === "live" ? Math.floor(Date.now() / 6e4) : Math.floor(Date.now() / 6e5);
  const p = fetch(`${dataBase()}${src === "live" ? "chartlive_" : "chartbt_"}${sid}.json?t=${stamp}`, { cache: "no-store" })
    .then(r => (r.ok ? r.json() : {})).catch(() => ({}))
    .then(data => { state.charts[key] = { at: Date.now(), data }; return data; });
  state.charts[key] = { ...(c || {}), pending: p };
  return p;
}

const OV_STYLE = { vwap: ["VWAP", "var(--live)", ""], ema9: ["9-period average", "var(--accent)", ""], ema21: ["21-period average", "#a259c4", ""],
  ema20: ["20-period average", "var(--accent)", ""], ema50: ["50-period average", "#a259c4", ""],
  bb_up: ["Upper band", "var(--muted)", ""], bb_mid: ["Middle band", "var(--muted)", "4 3"], bb_lo: ["Lower band", "var(--muted)", ""] };
const hmOf = t => { const m = Math.floor(((t + 19800) % 86400) / 60); return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };

function chartSvg(ch, t) {
  const n = ch.k.length;
  if (!n) return "";
  const W = 760, H = 340, L = 10, R = 170, T = 16, B = 26, pw = W - L - R, ph = H - T - B;
  let lo = Math.min(...ch.k.map(k => k[2])), hi = Math.max(...ch.k.map(k => k[1]));
  const band = (hi - lo) || 1, near = v => v != null && v > lo - .8 * band && v < hi + .8 * band;
  const stop = t.stop, target = t.target, ep = ch.ep, tgtOff = target != null && !near(target);
  [stop, ep, tgtOff ? null : target].forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  const extra = (ch.ln || []).filter(l => near(l[1]));
  extra.forEach(l => { lo = Math.min(lo, l[1]); hi = Math.max(hi, l[1]); });
  const pad = (hi - lo) * .07; lo -= pad; hi += pad;
  const x = i => L + (i + .5) / n * pw, y = v => T + (hi - v) / (hi - lo) * ph, cw = Math.max(2, pw / n * .62), slot = pw / n;
  const labels = [];
  let g = "";
  if (ch.bx) {                                                    // a shaded range, such as the opening range
    const [i0, i1, blo, bhi, name] = ch.bx;
    g += `<rect x="${(x(i0) - slot / 2).toFixed(1)}" y="${y(bhi).toFixed(1)}" width="${((i1 - i0 + 1) * slot).toFixed(1)}" height="${Math.max(1, y(blo) - y(bhi)).toFixed(1)}" fill="var(--accent)" opacity=".10"/>
      <text x="${(x(i0) - slot / 2 + 4).toFixed(1)}" y="${(y(bhi) - 4).toFixed(1)}" font-size="10" fill="var(--muted)">${esc(name)}</text>`;
  }
  g += `<rect x="${(x(ch.e) - slot / 2).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="var(--live)" opacity=".13"/>`;   // the trigger candle
  const hline = (v, color, dash, label, w = 1) => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-dasharray="${dash}"/>`;
    labels.push({ y: y(v), text: `${label} ${inr(v)}`, color });
  };
  extra.forEach(l => hline(l[1], "var(--muted)", "2 4", l[0]));
  if (stop != null) hline(stop, "var(--loss)", "6 4", "Stop", 1.4);
  if (target != null && !tgtOff) hline(target, "var(--gain)", "6 4", "Target", 1.4);
  hline(ep, "var(--ink)", "1 3", "Entry");
  if (tgtOff) labels.push({ y: target > hi ? T + 6 : H - B - 6, text: `Target ${inr(target)} ${target > hi ? "↑" : "↓"}`, color: "var(--gain)" });
  Object.entries(ch.ov || {}).forEach(([name, vals]) => {         // indicator lines, broken where there is no value
    const st = OV_STYLE[name] || [name, "var(--muted)", ""];
    let run = [];
    const flush = () => { if (run.length > 1) g += `<polyline points="${run.join(" ")}" fill="none" stroke="${st[1]}" stroke-width="1.6" stroke-dasharray="${st[2]}" stroke-linejoin="round"/>`; run = []; };
    vals.forEach((v, i) => { if (v == null || v < lo || v > hi) flush(); else run.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); });
    flush();
  });
  ch.k.forEach((k, i) => {                                        // candles
    const up = k[3] >= k[0], col = up ? "var(--gain)" : "var(--loss)";
    g += `<g><title>${hmOf(ch.t0 + ch.d[i] * 300)}  open ${inr(k[0])}, high ${inr(k[1])}, low ${inr(k[2])}, close ${inr(k[3])}</title>
      <line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(k[1]).toFixed(1)}" y2="${y(k[2]).toFixed(1)}" stroke="${col}" stroke-width="1.2"/>
      <rect x="${(x(i) - cw / 2).toFixed(1)}" y="${Math.min(y(k[0]), y(k[3])).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1.2, Math.abs(y(k[0]) - y(k[3]))).toFixed(1)}" fill="${col}"/></g>`;
  });
  const tk = ch.k[ch.e], buy = t.dir === 1;                       // trigger marker, on the side the trade wants to go
  const my = buy ? y(tk[2]) + 15 : y(tk[1]) - 15, px = x(ch.e);
  g += `<polygon points="${buy ? `${px},${my - 7} ${px - 6},${my + 4} ${px + 6},${my + 4}` : `${px},${my + 7} ${px - 6},${my - 4} ${px + 6},${my - 4}`}" fill="var(--live)" stroke="var(--surface)" stroke-width="1.2"/>
    <text x="${px.toFixed(1)}" y="${(T + 9).toFixed(1)}" font-size="10" font-weight="600" fill="var(--live)" text-anchor="middle">Trigger</text>`;
  if (ch.x != null && ch.xp != null) {                            // exit
    const xc = t.result === "WIN" ? "var(--gain)" : t.result === "LOSS" ? "var(--loss)" : "var(--muted)";
    g += `<circle cx="${x(ch.x).toFixed(1)}" cy="${y(ch.xp).toFixed(1)}" r="5.5" fill="${xc}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(ch.x).toFixed(1)}" y="${(y(ch.xp) + (t.dir === 1 ? 17 : -9)).toFixed(1)}" font-size="10" font-weight="600" fill="${xc}" text-anchor="middle">Exit</text>`;
  }
  labels.sort((a, b) => a.y - b.y);                               // right-hand labels, nudged apart so none overlap
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 12) labels[i].y = labels[i - 1].y + 12;
  labels.forEach(l => { g += `<text x="${W - R + 6}" y="${(l.y + 3.5).toFixed(1)}" font-size="10.5" fill="${l.color}" font-variant-numeric="tabular-nums">${esc(l.text)}</text>`; });
  const step = Math.max(1, Math.ceil(n / 8));
  for (let i = 0; i < n; i += step) g += `<text x="${x(i).toFixed(1)}" y="${H - 8}" font-size="10" fill="var(--muted)" text-anchor="middle">${hmOf(ch.t0 + ch.d[i] * 300)}</text>`;
  const leg = Object.keys(ch.ov || {}).map(k => `<span><i style="background:${(OV_STYLE[k] || [])[1] || "var(--muted)"}"></i>${esc((OV_STYLE[k] || [k])[0])}</span>`).join("");
  const why0 = (t.why || [])[0];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${esc(t.name)}: ${n} five-minute candles, ${buy ? "buy" : "sell"} trigger at ${hmOf(ch.t0 + ch.d[ch.e] * 300)} near ${inr(ep)}, stop ${inr(stop)}${target != null ? ", target " + inr(target) : ""}">${g}</svg>
    <div class="chart-legend"><span><i style="background:var(--live);opacity:.5"></i>Trigger candle (the one whose close gave the signal)</span>${leg}</div>
    ${why0 ? `<p class="note" style="margin-top:4px">${esc(why0)}</p>` : ""}`;
}

async function hydrateCharts() {
  for (const el of [...document.querySelectorAll("[data-cid]")]) {
    const t = ROWS.get(el.dataset.cid);
    if (!t) continue;
    const data = await getCharts(el.dataset.csrc, el.dataset.csid);
    if (!el.isConnected) continue;
    const ch = data && data[t.id];
    el.innerHTML = ch && ch.k && ch.k.length ? chartSvg(ch, t)
      : `<p class="note" style="margin:0">No chart was stored for this trade. Charts are kept for the last three days of live trades and the 100 most recent backtest trades of each strategy${t.opt ? ", and not for commodity options" : ""}.</p>`;
    el.scrollLeft = el.scrollWidth;
  }
}

/* ───────────── trade rows ───────────── */
function ticketText(t) {
  const risk = rupee(t.risk), name = srcMeta(t.sid).name;
  if (t.opt) return `${t.headline} | entry about ₹${inr(t.entry)}${t.stopPrice ? ` | option stop ₹${inr(t.stopPrice)}` : ""} | ${t.name} stop ${inr(t.stop)}, target ${inr(t.target)} | planned risk ${risk} | ${name}`;
  return `${t.dir === 1 ? "BUY" : "SELL"} ${inr(t.qty)} ${t.name} | entry about ₹${inr(t.entry)} | stop ₹${inr(t.stop)} | ${t.target ? `target ₹${inr(t.target)}` : "no fixed target"} | planned risk ${risk} | ${name}`;
}

function rowDetail(t, noActions) {
  ROWS.set(t.id, t);
  const open = t.status === "OPEN", nowP = open ? (t.last ?? t.entry) : t.exit;
  const fact = (l, v, c) => `<div>${l}<b class="${c || ""}">${v}</b></div>`;
  const qty = t.opt ? (t.kind === "option" ? `${t.lots} lot${t.lots > 1 ? "s" : ""} (${inr(t.qty)})` : `${inr(t.qty)} shares`) : inr(t.qty);
  const news = newsFor(t.name).slice(0, 2);
  const reward = !t.opt && t.target ? t.qty * Math.abs(t.target - t.entry) : null;
  return `<div class="detail">
    <div class="chart" data-csrc="${t.src}" data-csid="${t.sid}" data-cid="${esc(t.id)}"><p class="note" style="margin:14px 0 0">Loading the chart…</p></div>
    <div class="muted" style="font-size:.84rem;margin-top:14px">Where price stands between the stop and the target</div>${ladderOf(t)}
    <div class="facts">${fact("Entry price", "₹" + inr(t.entry))}${fact(open ? "Price now" : "Exit price", "₹" + inr(nowP))}${fact("Quantity", qty)}${fact("Planned risk", rupee(t.risk))}
      ${reward ? fact("Reward at target", rupee(reward)) + fact("Reward to risk", (reward / t.risk).toFixed(1) + " : 1") : ""}
      ${!t.opt ? fact("Position value", rupee(t.qty * t.entry)) : ""}
      ${t.opt && t.stopPrice ? fact("Option stop-loss", "₹" + inr(t.stopPrice)) : ""}
      ${!open && !t.opt ? fact("Before costs", signed(t.gross), cls(t.gross)) + fact("Costs", rupee(t.cost)) : ""}
      ${!open ? fact(t.opt ? "Result, before costs" : "After costs", signed(t.net), cls(t.net)) : ""}</div>
    ${noActions ? "" : `<div class="actions">${t.src === "live" ? `<button class="chip" data-copy="${esc(t.id)}">Copy order details</button>` : ""}
      <label class="took"><input type="checkbox" data-took="${esc(t.id)}" ${takenSet.has(t.id) ? "checked" : ""}> I took this trade</label></div>`}
    ${t.dec ? `<p class="subhead">${gradeOf(t) === "take" ? "Worth taking: it passed all the tool's checks" : "Only watching: it failed " + t.dec.f.map(f => FAIL_WORDS[f]).join(" and ")}</p>${decChips(t)}` : ""}
    ${t.regime && !t.opt ? `<p class="subhead">Market condition when it triggered</p><div>${esc(t.regime)}</div>` : ""}
    ${t.why ? `<p class="subhead">Why this trade was triggered</p><ul class="why">${t.why.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`
      : `<p class="note">The reasons are kept for the most recent trades only, to keep this page light.</p>`}
    ${news.length ? `<p class="subhead">In the news today</p><ul class="why">${news.map(n => `<li>${esc(n.tag)}: ${safeHttpUrl(n.link) ? `<a href="${esc(safeHttpUrl(n.link))}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title)} <span class="muted">[${esc(n.source)}]</span></li>`).join("")}</ul>` : ""}
    ${t.events ? `<p class="subhead">What happened</p><ol class="timeline">${t.events.map(e => `<li><time>${hhmm(e.t)}</time><span>${esc(e.text)}</span></li>`).join("")}</ol>` : ""}
    ${t.late ? `<p class="note">This signal was found after the fact (the desk was restarted), so no alert was sent for it.</p>` : ""}
  </div>`;
}

function ladderOf(t) {
  const e = t.opt ? t.uEntry : t.entry, risk = Math.abs(e - t.stop), target = t.target ?? e + t.dir * 3 * risk;
  const now = t.opt ? t.uLast : t.status === "OPEN" ? (t.last ?? e) : t.exit;
  return ladder({ stop_underlying: t.stop, target_underlying: target, underlying_entry: e, underlying_last: now, status: t.status, result: t.result,
    target_label: t.target == null ? "No target (3R mark)" : "Target" });
}

function tradeRow(t, showSrc) {
  const unresolved = t.status === "UNRESOLVED";
  const isOpen = state.open.has(t.id), pnl = t.status === "OPEN" ? (t.open ?? 0) : t.net, pill = unresolved ? "UNRESOLVED" : t.status === "OPEN" ? "OPEN" : t.result;
  const head = t.opt ? esc(t.headline) : `${t.dir === 1 ? "BUY" : "SELL"} ${inr(t.qty)} ${esc(t.name)}`;
  const sub = unresolved
    ? `Entered ${clock24(t.inT)} at ₹${inr(t.entry)}. No verified exit price; last option premium is reference-only. ${esc(t.unresolvedReason || t.reason || "Outcome unresolved")}`
    : t.status === "OPEN"
      ? `In at ${clock24(t.inT)}, ₹${inr(t.entry)}. ${t.opt ? (t.stopPrice ? "Option stop ₹" + inr(t.stopPrice) + "." : "") + (t.quoteStatus === "STALE" ? " Last premium is stale; premium stop is unverified." : "") : `Stop ₹${inr(t.stop)}${t.target ? `, target ₹${inr(t.target)}` : ", no fixed target"}`}`
      : `${clock24(t.inT)} at ₹${inr(t.entry)} to ${clock24(t.outT)} at ₹${inr(t.exit)}. ${esc(t.reason || HOW[t.how] || t.how)}`;
  const nw = newsFor(t.name)[0];
  const tags = (showSrc ? `<span class="tag-s">${esc(srcMeta(t.sid).name)}</span>` : "") + (t.opt && t.quoteStatus === "STALE" ? `<span class="tag-s" style="background:var(--loss-soft);color:var(--loss)">QUOTE STALE</span>` : "") + (takenSet.has(t.id) ? `<span class="tag-s" style="background:var(--gain-soft);color:var(--gain)">Taken</span>` : "") +
    (nw ? `<span class="tag-s" style="background:var(--live-soft);color:var(--live)" title="${esc(nw.title)}">In the news: ${esc(nw.tag)}</span>` : "");
  return `<div class="row"><button data-trade="${esc(t.id)}" aria-expanded="${isOpen}">
      <span class="pill ${pill}">${pill === "WIN" ? "Won" : pill === "LOSS" ? "Lost" : pill === "OPEN" ? "Open" : pill === "UNRESOLVED" ? "Unresolved" : "Flat"}</span>
      <span class="what">${tags}${head}<small>${sub}</small></span>
      <span class="res ${cls(pnl)}">${unresolved ? "—" : signed(pnl)}<small>${unresolved ? "P&L unresolved" : t.status === "CLOSED" ? num1(t.r || 0) + "R" + (t.opt ? "" : " after costs") : "so far"}</small></span>
    </button>${isOpen ? rowDetail(t) : ""}</div>`;
}

function rowList(rows, key, showSrc) {
  if (!rows.length) return "";
  const list = [...rows].reverse(), shown = list.slice(0, state[key]);
  let html = "", last = "";
  shown.forEach(t => { if (t.date !== last) { html += `<div class="day-label">${dayText(t.date)}</div>`; last = t.date; } html += tradeRow(t, showSrc); });
  if (list.length > shown.length) html += `<button class="more" data-smore="${key}">Show ${Math.min(25, list.length - shown.length)} more of ${list.length - shown.length} older trades</button>`;
  return html;
}

/* ───────────── the page: act first, everything else second ───────────── */
function takeExplainer() {
  const dec = state.sb && state.sb.decision;
  const rules = dec ? dec.rules : { cost: "Round-trip cost is at most 25% of the amount risked", vol: "Volume is at least 2x normal for this time of day (indices pass)", mkt: "Nifty is on the same side of its VWAP as the trade", conf: "No other strategy is already on the opposite side of the same stock today" };
  const res = dec && dec.take.n ? `<p class="note"><b>What the backtest says.</b> Over ${state.sb.period.days} sessions the tool produced ${dec.all.n.toLocaleString("en-IN")} signals. About ${dec.take_per_day} a day passed all four checks (${dec.take.n.toLocaleString("en-IN")} in total). Those lost ${num1(dec.take.summary.avg_r)}R each on average after costs, against ${num1(dec.all.summary.avg_r)}R for every signal, so the checks remove most of the loss. <b>They did not make it profitable</b>: the tool is picking the best of a weak set, and no trade here is proven to win.</p>` : "";
  return `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:.9rem">What does "worth taking" mean?</summary>
    <ul class="why" style="margin-top:8px">${Object.values(rules).map(r => `<li>${esc(r)}</li>`).join("")}</ul>${res}</details>`;
}

function takeSection(takeOpen, takeEnded, watchCount) {
  const ex = exposure(takeOpen), shown = state.showEnded ? [...takeOpen, ...takeEnded] : takeOpen;
  return sec("take", "Worth taking", takeOpen.length ? `${takeOpen.length} open · planned risk ${rupee(ex.risk)}` : "", `
    ${takeOpen.length ? shown.map(takeCard).join("") : `<div class="empty"><b>No trade meets the tool's standard right now.</b> ${watchCount ? `${watchCount} other signal${watchCount > 1 ? "s are" : " is"} being watched but not recommended (see More, below).` : "Nothing has triggered."} New ones appear here, and in Telegram, as soon as a signal passes all four checks.</div>`}
    ${takeEnded.length ? `<button class="more" data-ended="1">${state.showEnded ? "Hide" : "Show"} ${takeEnded.length} worth-taking trade${takeEnded.length > 1 ? "s" : ""} that already ended today</button>` : ""}
    ${takeExplainer()}`);
}

function mineSection(rows) {
  const mine = rows.filter(t => takenSet.has(t.id)).sort((a, b) => (a.iso < b.iso ? 1 : -1));
  if (!mine.length) return sec("mine", "My trades", "", `<div class="empty">Tick <b>I took this trade</b> on any trade and it is followed here with its live result. This is kept on this device only.</div>`);
  const open = mine.filter(t => t.status === "OPEN"), closed = mine.filter(t => t.status === "CLOSED"), unresolved = mine.filter(t => t.status === "UNRESOLVED");
  const oNet = open.reduce((a, t) => a + (t.open || 0), 0), cNet = closed.reduce((a, t) => a + t.net, 0);
  return sec("mine", "My trades", `${open.length} open · <span class="${cls(oNet)}">${signed(oNet)}</span> so far${closed.length ? ` · ${closed.length} closed · <span class="${cls(cNet)}">${signed(cNet)}</span>` : ""}${unresolved.length ? ` · ${unresolved.length} unresolved` : ""}`,
    `${open.map(t => takeCard(t)).join("")}${unresolved.map(t => tradeRow(t, true)).join("")}${closed.map(t => tradeRow(t, true)).join("")}
     <p class="note">Results are the tool's numbers for the trades you marked (strategy trades after estimated costs, options before). Unresolved option trades are excluded from realised P&amp;L. Your own fills will differ.</p>`);
}

function moverCard(m, rows) {
  const sl = state.sl, today = sl && sl.date, mine = rows.filter(t => t.name === m.name && t.date === today);
  const take = mine.filter(t => gradeOf(t) === "take" && t.dir === m.dir), watch = mine.filter(t => gradeOf(t) !== "take");
  const open = m.price / (1 + m.from_open / 100), first = mine.filter(t => t.dir === m.dir).sort((a, b) => (a.iso < b.iso ? -1 : 1))[0];
  let status;
  if (take.length) status = `<span class="vchip good">Worth taking</span> ${[...new Set(take.map(t => srcMeta(t.sid).name))].join(", ")} ${m.dir === 1 ? "bought" : "sold"} near ₹${inr(take[0].entry)} at ${clock24(take[0].inT)}.`;
  else if (mine.length) status = `<span class="vchip mixed">Only watching</span> ${mine.length} signal${mine.length > 1 ? "s" : ""} triggered, but none passed all the checks.`;
  else status = `<span class="vchip few">No signal yet</span> No strategy has triggered on this stock.`;
  const late = first ? Math.round(Math.abs((first.entry - open) / (m.price - open)) * 100) : null;
  const nw = newsFor(m.name)[0], tick = ok => `<span class="dchip ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}`;
  return `<div class="mover"><div class="mover-top"><div><b>${esc(m.name)}</b> <span class="muted">₹${inr(m.price)}</span></div><div class="mv-pct ${cls(m.dir)}">${m.move >= 0 ? "+" : "−"}${Math.abs(m.move).toFixed(1)}%</div></div>
    <div class="dchips">${tick(m.checks.volume)} Volume ${m.vol ?? "n/a"}x normal</span>${tick(m.checks.vwap)} ${m.dir === 1 ? "Above" : "Below"} VWAP</span>${tick(m.checks.held)} Holding near the ${m.dir === 1 ? "high" : "low"}</span></div>
    ${m.since ? `<div class="muted" style="font-size:.84rem">Flagged as genuine at ${hhmm(m.since)}</div>` : ""}
    ${nw ? `<div style="font-size:.88rem;margin-top:6px"><span class="tag-s" style="background:var(--live-soft);color:var(--live)">${esc(nw.tag)}</span>${esc(nw.title)}</div>` : ""}
    <div style="font-size:.9rem;margin-top:8px">${status}</div>
    ${late != null ? `<div class="muted" style="font-size:.84rem;margin-top:4px">The first signal came after <b>${Math.min(late, 999)}%</b> of the move from the open had already happened${late > 70 ? ", which is late" : late < 35 ? ", which is early" : ""}.</div>` : ""}</div>`;
}

function moversSection(rows) {
  const mv = state.sl && state.sl.movers, list = mv ? mv.list : [], genuine = list.filter(m => m.genuine), other = list.filter(m => !m.genuine);
  if (!state.sl) return sec("movers", "Trend setters", "", `<div class="empty">Waiting for the first strategy pass of the day.</div>`);
  const up = genuine.filter(m => m.dir === 1), down = genuine.filter(m => m.dir === -1);
  const col = (title, arr) => arr.length ? `<div><p class="subhead" style="margin-top:0">${title}</p>${arr.map(m => moverCard(m, rows)).join("")}</div>` : "";
  return sec("movers", "Trend setters", mv ? `as of ${hhmm(mv.asof)}` : "", `
    ${genuine.length ? `<div class="two">${col("Moving up", up)}${col("Moving down", down)}</div>` : `<div class="empty">No stock is making a big, volume-backed move that is holding right now.</div>`}
    <p class="note">A <b>genuine</b> trend setter is up or down 2% or more, on at least twice its usual volume, on the right side of VWAP and still holding near the day's high or low. Spikes that have faded, or moves on ordinary volume, are left out.</p>
    ${other.length ? `<details><summary class="muted" style="cursor:pointer;font-size:.9rem">${other.length} big move${other.length > 1 ? "s" : ""} the tool does not trust yet</summary><ul class="why" style="margin-top:8px">${other.map(m => `<li><b>${esc(m.name)}</b> ${m.move >= 0 ? "+" : "−"}${Math.abs(m.move).toFixed(1)}%: ${[!m.checks.volume ? "volume is ordinary" : "", !m.checks.vwap ? "price is on the wrong side of VWAP" : "", !m.checks.held ? "it has faded from the extreme" : "", m.size < 2 ? "move is under 2%" : ""].filter(Boolean).join(", ")}</li>`).join("")}</ul></details>` : ""}`);
}

function det(key, title, count, fn) {
  const open = state.det.has(key);
  let inner = "";
  if (open) { INNER = true; try { inner = fn(); } finally { INNER = false; } }
  return `<details class="blk" data-d="${key}" ${open ? "open" : ""}><summary><span>${title}</span><span class="muted">${count || ""}</span></summary>${open ? `<div class="blk-body">${inner}</div>` : ""}</details>`;
}


const sec = (id, title, right, inner) => INNER ? inner : `<section id="${id}"><div class="sec-head"><h2>${title}</h2><span class="muted" style="font-size:.88rem">${right || ""}</span></div>${inner}</section>`;

function spark(pts) {
  if (!pts || pts.length < 2) return "";
  const step = Math.max(1, Math.floor(pts.length / 40)), p = pts.filter((_, i) => i % step === 0).concat(pts[pts.length - 1]);
  const mn = Math.min(0, ...p), mx = Math.max(0, ...p), sp = (mx - mn) || 1, W = 84, H = 24, zy = (H - 2 - (0 - mn) / sp * (H - 4)).toFixed(1);
  const line = p.map((v, i) => `${(i / (p.length - 1) * W).toFixed(1)},${(H - 2 - (v - mn) / sp * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${zy}" y2="${zy}" stroke="var(--line)"/>
    <polyline points="${line}" fill="none" stroke="${p[p.length - 1] >= 0 ? "var(--gain)" : "var(--loss)"}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

function renderHeader() {
  const pulse = $("pulse"), banner = $("banner");
  const out = { running: false, waitingLogin: false, missing: false };
  banner.innerHTML = LIVE ? "" : `<div class="banner"><b>Preview only.</b> This bundled dashboard uses sample records for layout testing. Its historical strategy snapshot may predate this release's next-candle execution model; rerun the backtest after setup before evaluating results. The options desk's live trades are synthetic examples.</div>`;
  const st = state.feed && state.feed.status;
  if (!st) { pulse.innerHTML = `<span class="dot"></span><span>Not connected</span>`; return out; }
  const seen = st.heartbeat || st.updated, fresh = seen && (!LIVE || Date.now() - new Date(seen).getTime() < 7 * 60e3);
  out.running = !!(st.running && fresh); out.waitingLogin = out.running && st.phase === "login"; out.missing = LIVE && !out.running && inHours();
  pulse.innerHTML = `<span class="dot ${out.running ? "on" : ""}"></span><span>${out.waitingLogin ? "Waiting for Fyers login" : out.running ? "Watching now" : out.missing ? "Not checking in" : "Resting"}${seen ? `, last check-in ${hhmm(seen)}${LIVE && seen.slice(0, 10) !== new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }) ? " on " + dayText(seen.slice(0, 10)) : ""}` : ""}</span>`;
  if (LIVE) banner.innerHTML = out.waitingLogin ? `<div class="banner"><b>Waiting for your Fyers login.</b> Open your Telegram bot, tap the login link, and paste the code back. The tool cannot watch the market until then.</div>`
    : out.missing ? `<div class="alarm"><b>The engine has not checked in${seen ? " since " + hhmm(seen) : ""}.</b> A backup start is attempted every 10 minutes during market hours, so it should restart by itself. If this message is still here after 20 minutes, start it from the Actions tab with Run workflow.</div>` : "";
  return out;
}

function exposure(rows) {
  return { risk: rows.reduce((a, t) => a + (t.risk || 0), 0), cap: rows.reduce((a, t) => a + (t.qty || 0) * (t.entry || 0), 0), pnl: rows.reduce((a, t) => a + (t.open || 0), 0) };
}

  const intraday = ib && ib.stocks ? `<div class="intraday-strip"><span><b>${ib.trending}%</b> trending</span><span><b>${ib.above_vwap}%</b> above VWAP</span><span><b>${ib.up_on_day}%</b> up on the day</span></div><p class="note">Intraday sample: ${ib.stocks} shares scanned by the strategy desk, not the full NSE market. Use daily breadth above for the wider-market view.</p>` : "";

function groupOpen(rows) {
  const g = new Map();
  rows.forEach(t => { if (!g.has(t.name)) g.set(t.name, []); g.get(t.name).push(t); });
  return [...g.entries()].map(([name, ts]) => {
    const side = d => new Set(ts.filter(t => t.dir === d).map(t => t.sid)), buy = side(1), sell = side(-1);
    const dir = buy.size && sell.size ? 0 : buy.size ? 1 : -1, ex = exposure(ts);
    return { name, trades: ts, dir, strategies: [...new Set(ts.map(t => t.sid))], agree: dir === 0 ? Math.max(buy.size, sell.size) : (dir === 1 ? buy.size : sell.size), risk: ex.risk, pnl: ex.pnl, latest: ts.reduce((m, t) => (t.iso > m ? t.iso : m), "") };
  }).sort((a, b) => b.agree - a.agree || (a.latest < b.latest ? 1 : -1));
}

function groupRow(g) {
  const isOpen = state.openGroups.has(g.name), word = g.dir === 0 ? "MIXED" : g.dir === 1 ? "BUY" : "SELL";
  const chips = g.strategies.map(id => `<span class="tag-s">${esc(srcMeta(id).name)}</span>`).join("");
  return `<div class="row grp"><button data-group="${esc(g.name)}" aria-expanded="${isOpen}">
      <span class="pill ${word}">${word === "MIXED" ? "Mixed" : word}</span>
      <span class="what">${esc(g.name)}<small>${g.agree} strateg${g.agree === 1 ? "y" : "ies"} ${g.dir === 0 ? "on the larger side · conflicting signals" : "agree"}</small><span class="chips">${chips}</span></span>
      <span class="res ${cls(g.pnl)}">${signed(g.pnl)}<small>${rupee(g.risk)} at risk</small></span></button>
    ${isOpen ? `<div class="grp-body">${g.trades.sort((a, b) => (a.iso < b.iso ? 1 : -1)).map(t => tradeRow(t, true)).join("")}</div>` : ""}</div>`;
}

function watchingBlock(rows) {
  const groups = groupOpen(rows), shown = state.openAll ? groups : groups.slice(0, 12), ex = exposure(rows);
  if (!rows.length) return `<div class="empty">No signal is being watched right now.</div>`;
  const reasons = {};
  rows.forEach(t => (t.dec ? t.dec.f : []).forEach(f => { reasons[f] = (reasons[f] || 0) + 1; }));
  const why = Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([f, n]) => `${n} ${FAIL_WORDS[f]}`).join(" · ");
  return `<p class="note" style="margin-top:0">These signals triggered but failed at least one of the tool's checks, so it is <b>not recommending them</b>. ${why ? `Why: ${why}.` : ""} They are kept so you can see what the strategies are doing. Tap a stock for the trades and charts.</p>
    <div class="expo"><span><b>${rows.length}</b> signals in <b>${groups.length}</b> stocks</span><span class="${cls(ex.pnl)}"><b>${signed(ex.pnl)}</b> so far, before costs</span></div>
    ${shown.map(groupRow).join("")}${groups.length > 12 ? `<button class="more" data-openall="1">${state.openAll ? "Show fewer" : `Show all ${groups.length} stocks`}</button>` : ""}`;
}

function takeCell(id) {
  const b = id === "options" ? null : sbOf(id), t = b && b.take;
  if (!t || !t.n) return '<span class="muted">n/a</span>';

}

function scoreboard(S) {
  const rows = [...S].sort((a, b) => (b.bt ? b.bt.net : -1e12) - (a.bt ? a.bt.net : -1e12));
  const maxAbs = Math.max(1, ...rows.map(r => (r.bt ? Math.abs(r.bt.net) : 0)));
  const body = rows.map(r => {
    const w = r.bt ? Math.abs(r.bt.net) / maxAbs * 50 : 0;
    return `<tr data-sheet="${r.id}"><td><button class="link" data-sheet="${r.id}">${esc(r.meta.name)}</button><small>${esc(r.meta.source)}</small></td>
      <td>${r.today.n}${r.today.open ? ` <span class="muted">(${r.today.open} open)</span>` : ""}</td>

      <td>${takeCell(r.id)}</td><td>${spark(r.curve)}</td><td><span class="vchip ${r.level}">${VERDICT[r.level]}</span></td></tr>`;

  return sec("board", "Which strategy is working?", "Tap any row to drill in", `

}

/* ───────────── the combined log ───────────── */
function logFilter(rows) {
  let out = rows;
  if (state.logSrc === "strategies") out = out.filter(x => x.sid !== "options");
  else if (state.logSrc !== "all") out = out.filter(x => x.sid === state.logSrc);
  if (state.logStatus === "open") out = out.filter(x => x.status === "OPEN");
  else if (state.logStatus === "unresolved") out = out.filter(x => x.status === "UNRESOLVED");
  else if (state.logStatus === "won") out = out.filter(x => x.status === "CLOSED" && x.net > 0);
  else if (state.logStatus === "lost") out = out.filter(x => x.status === "CLOSED" && x.net < 0);
  else if (state.logStatus === "taken") out = out.filter(x => takenSet.has(x.id));
  if (state.logPeriod !== "all" && rows.length) {
    const last = rows.reduce((m, x) => (x.date > m ? x.date : m), ""), days = state.logPeriod === "today" ? 0 : +state.logPeriod;
    const cut = new Date(new Date(last + "T00:00:00Z").getTime() - days * 864e5).toISOString().slice(0, 10);
    out = out.filter(x => x.date >= cut);
  }
  const q = state.logQ.trim().toLowerCase();
  return q ? out.filter(x => `${x.name} ${x.headline || ""} ${srcMeta(x.sid).name}`.toLowerCase().includes(q)) : out;
}

function logSection() {
  const all = allRows(), list = logFilter(all);
  const sources = [["all", "Everything"], ["options", "Options desk"], ["strategies", `All ${STRATS.length} strategies`], ...STRATS.map(s => [s.id, s.name])];
  const chip = (k, key, v, label) => `<button class="chip" data-${k}="${v}" aria-pressed="${state[key] === v}">${label}</button>`;
  const closed = list.filter(x => x.status === "CLOSED"), won = closed.filter(x => x.net > 0).length, lost = closed.filter(x => x.net < 0).length;
  const net = closed.reduce((s, x) => s + x.net, 0);
  const shown = [...list].reverse().slice(0, state.lshown);
  let body = "", last = "";
  shown.forEach(x => { if (x.date !== last) { body += `<div class="day-label">${dayText(x.date)}</div>`; last = x.date; } body += tradeRow(x, true); });
  if (list.length > shown.length) body += `<button class="more" data-smore="lshown">Show ${Math.min(25, list.length - shown.length)} more of ${list.length - shown.length} older trades</button>`;
  const mine = all.filter(x => takenSet.has(x.id)), mineClosed = mine.filter(x => x.status === "CLOSED");
  return sec("log", "Every trade", `${list.length} shown${list.length !== all.length ? ` of ${all.length}` : ""} · ${won} won, ${lost} lost · <span class="${cls(net)}">${signed(net)}</span> closed`, `
    <div class="filters">
      <label class="muted" style="align-self:center">Source <select id="logsrc" class="ctl">${sources.map(([v, l]) => `<option value="${v}" ${state.logSrc === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
      <input id="logq" class="ctl" type="search" placeholder="Search a stock or index" value="${esc(state.logQ)}" aria-label="Search by stock or index" style="border-radius:999px;min-width:200px">
      <span style="width:6px"></span>${[["all", "All"], ["open", "Open"], ["unresolved", "Unresolved"], ["won", "Won"], ["lost", "Lost"], ["taken", "Taken by me"]].map(([v, l]) => chip("lstatus", "logStatus", v, l)).join("")}
      <span style="width:6px"></span>${[["all", "All time"], ["7", "Last 7 days"], ["today", "Latest day"]].map(([v, l]) => chip("lperiod", "logPeriod", v, l)).join("")}</div>
    ${mine.length ? `<p class="note" style="margin-top:0">You marked <b>${mine.length}</b> trade${mine.length > 1 ? "s" : ""} as taken (on this device only). ${mineClosed.length ? `Of those, ${mineClosed.length} ${mineClosed.length > 1 ? "have" : "has"} closed for <b class="${cls(mineClosed.reduce((a, x) => a + x.net, 0))}">${signed(mineClosed.reduce((a, x) => a + x.net, 0))}</b> by the tool's numbers.` : ""}</p>` : ""}
    ${all.length ? (list.length ? body : `<div class="empty">No trade matches these filters.</div>`) : `<div class="empty">No trades yet. They appear here as soon as the options desk or any strategy triggers one.</div>`}
    ${list.length ? `<button class="dl" data-logcsv="1">Download these ${list.length} trades (spreadsheet file)</button>` : ""}
    <p class="note">Strategy results are after estimated costs; options desk results are before costs, so totals that mix the two mix their bases. Unresolved option positions are retained without fabricated exit prices or realised P&amp;L. Strategy trades are kept in detail for 10 days; older ones are folded into running totals.</p>`);
}

function downloadLog() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Source", "Date", "Market", "Direction", "In", "Out", "Entry price", "Exit price", "Result", "R", "How it ended", "Status", "Taken by me"];
  const rows = logFilter(allRows()).map(t => [srcMeta(t.sid).name, t.date, t.name, t.dir === 1 ? "BUY" : "SELL", t.inT, t.outT, t.entry, t.exit ?? "", t.status === "OPEN" ? (t.open ?? "") : t.net, t.r ?? "", t.how || "", t.status, takenSet.has(t.id) ? "yes" : ""].map(q).join(","));
  const url = URL.createObjectURL(new Blob([[head.map(q).join(","), ...rows].join("\n")], { type: "text/csv" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "signal-desk-all-trades.csv" });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function liveStrategy(id) {

  }).join("");
  return `<div class="card" style="margin-bottom:14px"><h3>Portfolio after admission and risk limits</h3>
    <p class="muted" style="margin:6px 0 10px">Only risk-approved TAKE signals are counted here. Rejected candidates remain visible in the individual strategy research tabs.</p>

  </div>`;
}

const NAV = [["overview", "Overview"], ["take", "Share ideas"], ["options", "Calls & puts"], ["watchlist", "Watchlist"], ["market", "Market"], ["mine", "My trades"], ["more", "Research & logs"]];

function freshness() {
  const el = $("fresh"), sl = state.sl && state.sl.status;
  if (!el) return;
  if (!LIVE) { el.innerHTML = `<span class="muted">Preview data, so it does not refresh.</span>`; return; }
  const bar = sl && sl.bar_end ? clock24(sl.bar_end.slice(11, 16)) : null;
  const age = sl && sl.cycle_at ? (Date.now() - new Date(sl.cycle_at).getTime()) / 60e3 : null;
  const stale = age != null && age > 9 && inHours();
  el.innerHTML = `${bar ? `Prices as of the <b>${bar}</b> candle · ` : ""}page updated <b>${hhmm(new Date(state.loadedAt + 19800e3).toISOString())}</b> · refreshes every 2 minutes (next in <span id="cd">2:00</span>) · <button class="chip" data-refresh="1" ${state.loading ? "disabled" : ""}>${state.loading ? "Refreshing…" : "Refresh now"}</button>
    ${stale ? `<span class="loss"> Strategy data is ${Math.round(age)} minutes old.</span>` : ""}`;
}
function tickCountdown() {
  const c = $("cd");
  if (!c || !state.loadedAt) return;
  const left = Math.max(0, Math.round((state.loadedAt + REFRESH_MS - Date.now()) / 1000));
  c.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
}
async function refresh() {
  if (state.loading) return;
  state.loading = true; freshness();
  try { await load(); state.loadedAt = Date.now(); } finally { state.loading = false; }
  render();
}

  const cal = r ? `<div class="rgrid event-grid">${col("Just reported", "Watch the first reaction", r.last)}${col("Reporting today", "Potential event-day volatility", r.today)}${col("Before next session", "Overnight event risk", r.next)}</div>${r.later && r.later.length ? `<p class="note">Coming later: ${r.later.map(e => `${esc(e.symbol)} (${esc(e.date.slice(5))})`).join(", ")}</p>` : ""}`

  const fresh = r ? (r.ok ? `<span class="muted">NSE calendar checked ${r.fetched_at ? hhmm(r.fetched_at) : "today"}</span>` : `<span class="alarm" style="padding:2px 8px">NSE calendar unavailable${r.error ? ": " + esc(r.error) : ""}; event list may be incomplete.</span>`) : "";
  const inTrade = new Set(rows.filter(t => t.status === "OPEN").map(t => t.name));
  const board = new Map(((sc && sc.board) || []).map(x => [x.name || String(x.symbol || "").replace(/^NSE:/, "").replace(/-EQ$/, ""), x]));
  const classify = w => {
    const why = String(w.why || "").toLowerCase(), name = w.name;
    if (inTrade.has(name)) return "trade";
    if (why.includes("result")) return "results";
    if (why.includes("news") || why.includes("headline")) return "news";
    if (why.includes("volume") || why.includes("moved") || why.includes("move")) return "volume";
    if (w.rs != null && w.rs >= 80) return "leaders";
    return "other";
  };
  const filtered = wl.map((w,i) => ({...w, _i:i, _kind:classify(w), _board:board.get(w.name)}))
    .filter(w => (!state.wlQ || `${w.name} ${w.why}`.toLowerCase().includes(state.wlQ.toLowerCase())) &&
      (state.wlFilter === "all" || w._kind === state.wlFilter || (state.wlFilter === "leaders" && w.rs >= 80)))
    .sort((a,b) => state.wlSort === "rs" ? ((b.rs ?? -1) - (a.rs ?? -1)) : state.wlSort === "name" ? a.name.localeCompare(b.name) : a._i-b._i);
  const filters = [["all","All"],["results","Results"],["news","News"],["volume","Volume / move"],["leaders","RS leaders"],["trade","In a trade"]];
  const list = wl.length ? `<div class="watch-toolbar"><label class="searchbox"><span>⌕</span><input id="wlq" type="search" aria-label="Search the watchlist" placeholder="Find a share or catalyst…" value="${esc(state.wlQ)}" autocomplete="off"></label><label class="sortbox">Sort <select id="wlsort"><option value="priority" ${state.wlSort === "priority" ? "selected" : ""}>Priority</option><option value="rs" ${state.wlSort === "rs" ? "selected" : ""}>Relative strength</option><option value="name" ${state.wlSort === "name" ? "selected" : ""}>Name</option></select></label></div>
    <div class="filters watch-filters" role="group" aria-label="Filter watchlist">${filters.map(([id,label]) => `<button class="chip" data-wlf="${id}" aria-pressed="${state.wlFilter === id}">${label}${id === "all" ? ` · ${wl.length}` : ""}</button>`).join("")}</div>
    <div class="watch-meta"><span>${filtered.length} of ${wl.length} shares</span><span>Search and filters are local to this dashboard</span></div>
    ${filtered.length ? `<div class="card table-card"><div class="scroll"><table class="watch"><thead><tr><th>Share</th><th>Why in play</th><th>RS</th><th>Move</th><th>Relative volume</th><th>Status</th></tr></thead><tbody>${filtered.map(w => { const q = w._board || {}; return `<tr><td><b>${esc(w.name)}</b></td><td>${esc(w.why)}</td><td class="num">${w.rs == null ? "—" : `${w.rs >= 80 ? "★ " : ""}${Math.round(w.rs)}`}</td><td class="num ${cls(q.move)}">${q.move == null ? "—" : `${q.move >= 0 ? "+" : "−"}${Math.abs(q.move).toFixed(2)}%`}</td><td class="num">${q.volx == null ? "—" : `${q.volx}×`}</td><td>${inTrade.has(w.name) ? `<span class="vchip good">Open trade</span>` : `<span class="muted">Watching</span>`}</td></tr>`; }).join("")}</tbody></table></div></div>` : `<div class="empty">No shares match these filters. Clear the search or choose All.</div>`}`
    : `<div class="empty">The watchlist fills in after the first 5-minute pass.</div>`;
  const quality = sc && sc.quality ? sc.quality : null;
  const note = sc ? `<div class="watch-foot"><span>${sc.have_baseline} / ${sc.of} normal-volume baselines ready</span>${quality ? `<span>${quality.fresh} / ${quality.expected} fresh quotes · ${quality.exchange_timestamps || 0} exchange-timestamped</span>` : ""}</div>` : "";
  return sec("watchlist", "Watchlist & catalysts", fresh, `${cal}<div class="subhead watchlist-subhead">On the watchlist now <span class="muted">Ranked by catalyst, participation and context</span></div>${list}${note}${leadersBlock()}`);
}
