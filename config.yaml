# ─────────────────────────────────────────────────────────────
#  SIGNAL DESK SETTINGS
#  Change a value, save, and the tool uses it from its next run.
#  Lines starting with # are notes for you. The tool ignores them.
# ─────────────────────────────────────────────────────────────

# One ceiling shared by the options/cash rulebook and the three-strategy intraday paper desk.
# Each engine also has its own tighter sub-limits below.
portfolio:
  enabled: true
  max_open_positions: 8
  max_open_risk: 17500
  max_daily_loss: 3500

general:
  lots: 1                    # lots per options trade. With 1 lot the whole trade exits at the target.
                             # With 2 or more, half is booked at the target and the rest is trailed.
  strike: ATM                # ATM = at-the-money, ITM1 = one strike in-the-money
  max_trades_per_day: 0      # per market. 0 = no limit, take every trade that triggers
  stop_after_losses: 0       # stop a market for the day after this many losing trades. 0 = never stop
  max_range_pct: 0.6         # skip the day if the opening range is wider than this % of price
  portfolio:
    enabled: true
    max_open_positions: 5
    max_open_risk: 15000       # total initial rupee risk allowed across open rulebook positions
    max_daily_loss: 3000       # stop accepting new rulebook trades after this much realised loss

# Early exit: leave a trade before the stop-loss when the pattern that triggered it breaks.
early_exit:
  enabled: true
  closes_back_inside_range: 2   # exit after this many 5-minute closes back inside the opening range. 0 = off
  vwap_break: true              # exit on a 5-minute close on the wrong side of the day's average price line

# Where prices come from. This tool only reads prices; it never places an order with either broker.
#   kotak = Kotak Neo (the default). Needs one GitHub secret, KOTAK_CONSUMER_KEY, and no daily login.
#           Kotak gives no price history for MCX commodities, so the commodity markets below are paused.
#   fyers = Fyers (needs FYERS_APP_ID and FYERS_SECRET_KEY, and a login through Telegram each day).
broker:
  primary: kotak
  commodity_feed: fyers         # optional second feed: Fyers supplies MCX history/quotes; Kotak keeps NSE/BSE
  kotak:
    environment: prod
    # If the Kotak check (Actions tab, "Kotak check") says an index name was not found, set it here, for example:
    # index_tokens:
    #   "NSE:NIFTY50-INDEX": "nse_cm|Nifty 50"
    #   "NSE:NIFTYBANK-INDEX": "nse_cm|Nifty Bank"
    #   "NSE:FINNIFTY-INDEX": "nse_cm|Nifty Fin Service"
    #   "NSE:MIDCPNIFTY-INDEX": "nse_cm|NIFTY MIDCAP SELECT"
    #   "BSE:SENSEX-INDEX": "bse_cm|SENSEX"

# News: the legacy stock-headline scan plus the separate 24/7 News Impact service.
news:
  enabled: true

# Around-the-clock event-driven market intelligence. The service runs independently
# of exchange sessions and never creates a trade by itself.
news_intelligence:
  enabled: true
  poll_seconds: 300             # continuous scan every 5 minutes, including weekends/holidays
  max_age_hours: 48
  retention_days: 21
  max_events: 180
  telegram_min_impact_score: 82
  watchlist_min_impact_score: 65   # event-linked equities enter the strategy desk's normal watch queue
  watchlist_max_age_hours: 36
  ai:
    enabled: true               # uses OpenAI when OPENAI_API_KEY exists; otherwise deterministic rules continue
    model: gpt-4o-mini           # configurable; API usage is billed separately by OpenAI
    timeout_seconds: 24
    max_new_per_scan: 4         # cost/rate guard; only unseen headlines are analysed
  queries:
    - {id: geopolitics-energy, query: "Iran Israel Middle East Strait of Hormuz Red Sea oil shipping conflict"}
    - {id: oil-gas-supply, query: "OPEC crude oil production supply disruption LNG natural gas prices"}
    - {id: metals-safe-haven, query: "gold silver copper metals safe haven central bank prices"}
    - {id: rates-fx, query: "Federal Reserve interest rates RBI inflation rupee dollar India"}
    - {id: china-trade, query: "China stimulus economy tariffs trade restrictions India exports"}
    - {id: india-policy-weather, query: "India budget government policy monsoon weather agriculture"}
    - {id: corporate-catalysts, query: "India listed companies major order earnings merger regulatory action"}

# Results: which Nifty 200 companies report, read from NSE's public calendar. They go first on the watchlist, from the day
# before their results until the day after, so the move is anticipated, not chased.
results:
  enabled: true
  # extra:                       # a result NSE's calendar missed
  #   - {symbol: HDFCBANK, date: "2026-11-20"}

# Watchlist and load. Only the watchlist gets candles and strategy scans: the indices, open trades, results, news, and any share
# that a cheap quotes scan finds on unusual volume or moving a lot.
watch:
  min_volume_ratio: 1.5          # volume this many times normal for the time of day promotes a share
  min_move_pct: 1.5              # or a move this big from yesterday's close
  max_promoted: 30               # at most this many promoted shares are scanned each candle
  max_quote_age_s: 600           # stale exchange quotes are not used to promote a share
  max_future_skew_s: 10          # reject broker timestamps materially ahead of our clock

# Options scanner: calls and puts on each index, shown on the dashboard with the contract, stop and target.
options_scan:
  min_score: 4                   # of 5 points. Lower it to see more ideas, raise it to see fewer
  target_r: 1.5                  # target = premium + this many times the risk
  strike: ATM                    # ATM or ITM1
  max_cost_ratio: 0.25           # costs, including the bid-ask spread, may be at most this share of the risk
  max_spread_pct: 5.0            # skip a contract whose bid-ask spread is wider than this % of its price
  max_quote_age_s: 120           # skip a contract whose price is older than this
  max_data_age_s: 600            # index candles older than this are not trusted
  min_open_interest: 1000        # avoid contracts with negligible open interest; tune per market if needed

# What reaches Telegram. Everything not listed as true stays on the dashboard only.
alerts:
  brief: true                    # one message at the open: results, news, what is on the watchlist
  trades: true                   # a share trade worth taking
  exits: true                    # how those trades ended
  options: true                  # a call or put idea worth taking, and the options desk's own entries and exits
  summary: true                  # one message after the close
  faults: true                   # prices not arriving; the same fault is sent once an hour
  movers: false                  # trend-setter notes
  news: false                    # news digests
  info: false                    # started, restarted, setup check

# Exchange holidays are read from NSE. Add any it misses (YYYY-MM-DD).
holidays: []

# Days on which the tool should not take new trades (RBI policy, Budget, etc).
# Format: "YYYY-MM-DD". You can also just send the word  skip  to your Telegram bot on the day.
skip_dates: []
# skip_dates: ["2027-02-01", "2027-02-05"]

markets:
  - id: NIFTY
    name: Nifty 50
    enabled: true
    kind: index
    spot: "NSE:NIFTY50-INDEX"
    root: NIFTY
    master: NSE_FO
    range: ["09:15", "09:45"]
    entry: ["09:45", "11:30"]
    exit_by: "14:45"
    premium_stop_pct: 25
    min_days_to_expiry: 1    # on expiry day, use next week's contract
    near_expiry: roll

  - id: SENSEX
    name: Sensex
    enabled: true
    kind: index
    spot: "BSE:SENSEX-INDEX"
    root: SENSEX
    master: BSE_FO
    range: ["09:15", "09:45"]
    entry: ["09:45", "11:30"]
    exit_by: "14:45"
    premium_stop_pct: 25
    min_days_to_expiry: 1
    near_expiry: roll

  - id: BANKNIFTY
    name: Bank Nifty
    enabled: true
    kind: index
    spot: "NSE:NIFTYBANK-INDEX"
    root: BANKNIFTY
    master: NSE_FO
    range: ["09:15", "09:45"]
    entry: ["09:45", "11:30"]
    exit_by: "14:45"
    premium_stop_pct: 30
    min_days_to_expiry: 3    # no trades on expiry day or the two days before it
    near_expiry: skip

  - id: FINNIFTY
    name: Fin Nifty
    enabled: true
    kind: index
    spot: "NSE:FINNIFTY-INDEX"
    root: FINNIFTY
    master: NSE_FO
    range: ["09:15", "09:45"]
    entry: ["09:45", "11:30"]
    exit_by: "14:45"
    premium_stop_pct: 30
    min_days_to_expiry: 3
    near_expiry: skip

  - id: MIDCPNIFTY
    name: Midcap Nifty
    enabled: true
    kind: index
    spot: "NSE:MIDCPNIFTY-INDEX"
    root: MIDCPNIFTY
    master: NSE_FO
    range: ["09:15", "09:45"]
    entry: ["09:45", "11:30"]
    exit_by: "14:45"
    premium_stop_pct: 30
    min_days_to_expiry: 3
    near_expiry: skip

  - id: CRUDE
    name: Crude oil
    enabled: true
    kind: commodity
    root: CRUDEOILM          # CRUDEOILM = mini (10 barrels). Use CRUDEOIL for the big contract.
    multiplier: 10           # rupees gained or lost per 1 rupee move, per lot (CRUDEOIL = 100)
    master: MCX_COM
    session_start: "09:00"
    range: ["18:00", "18:30"]
    entry: ["18:30", "20:30"]
    exit_by: "22:30"
    premium_stop_pct: 30
    min_days_to_expiry: 3
    near_expiry: roll
    skip_weekdays: [WED]     # weekly US oil inventory report evening

  - id: GOLD
    name: Gold
    enabled: true
    kind: commodity
    root: GOLDM              # GOLDM = gold mini (100 grams)
    multiplier: 10           # GOLDM price is per 10 grams and a lot is 100 grams
    master: MCX_COM
    session_start: "09:00"
    range: ["18:00", "18:30"]
    entry: ["18:30", "20:30"]
    exit_by: "22:30"
    premium_stop_pct: 25
    min_days_to_expiry: 3
    near_expiry: roll

  - id: SILVER
    name: Silver
    enabled: true
    kind: commodity
    root: SILVERM            # SILVERM = silver mini (5 kg)
    multiplier: 5            # SILVERM price is per kg and a lot is 5 kg
    master: MCX_COM
    session_start: "09:00"
    range: ["18:00", "18:30"]
    entry: ["18:30", "20:30"]
    exit_by: "22:30"
    premium_stop_pct: 25
    min_days_to_expiry: 3
    near_expiry: roll

  - id: NATGAS
    name: Natural gas
    enabled: true
    kind: commodity
    root: NATGASMINI         # mini contract (250 mmBtu). Use NATURALGAS for the big one.
    multiplier: 250          # NATURALGAS = 1250
    master: MCX_COM
    session_start: "09:00"
    range: ["18:00", "18:30"]
    entry: ["18:30", "20:30"]
    exit_by: "22:30"
    premium_stop_pct: 30
    min_days_to_expiry: 3
    near_expiry: roll
    skip_weekdays: [THU]     # weekly US gas storage report evening
    max_range_pct: 1.5       # natural gas swings more than the others, so it gets a wider limit

stocks:
  enabled: false             # off: the strategy desk below now covers shares, with results and volume built in. true = also run the older stock rulebook
  range: ["09:15", "09:30"]
  entry: ["09:30", "11:30"]
  exit_by: "15:00"
  min_move_pct: 1.0          # stock must be up or down at least this much from yesterday's close
  volume_multiple: 2.0       # first 15 minutes' volume must be at least this many times its usual
  watchlist_size: 6          # how many Nifty 200 stocks to watch each day
  trade_as: cash             # cash = buy or sell the share itself, option = buy the stock's option
  risk_per_trade: 500        # rupees you are willing to lose on one stock trade (sets the quantity)
  max_position_value: 40000  # never suggest a stock position bigger than this many rupees
  premium_stop_pct: 30       # used only when trade_as is option
  min_days_to_expiry: 5      # used only when trade_as is option (avoids expiry week)

# Strategy desk: three intraday strategies (opening range breakout, opening drive, EMA pullback) chosen from research. They run
# at the same time on the Nifty 200 shares and five indices. Each is tested on past prices and followed live.
# Every trade is a paper trade: shares bought or sold intraday, or one lot of an index future. Nothing is ordered.
strategies:
  enabled: true
  telegram: signals            # signals = a grouped message whenever any strategy triggers, plus a summary after the
                               # close (can be many a day). summary = the after-close summary only. off = none
  alert_for: all               # all, or a list to limit the alerts, e.g. [orb, vwap, gap]
  alert_grade: take            # take = alert only on trades that pass all required checks.
                               # Unknown required data fails closed to watch. all = alert on every risk-approved signal.
  # decide:                    # what makes a signal a real trade (take) instead of something to watch
  #   max_cost_ratio: 0.25     # round-trip costs may be at most this share of the amount risked
  #   min_volume: 2.0          # shares need this many times their usual volume for the time of day
  #   need_market: true        # Nifty must be on the same side of its VWAP as the trade
  #   no_conflict: true        # no other strategy already on the opposite side of the same stock
  exit_by: "15:15"             # every trade is closed by this time
  max_candle_age_s: 600         # selected shares with older last-completed 5m candles are skipped
  risk_per_trade: 500          # rupees risked on one share trade (this sets the quantity)
  max_position_value: 40000    # never size a share position above this many rupees
  max_trades_per_symbol_day: 0 # 0 = no limit
  # costs:                     # estimates; raise them if your broker charges more
  #   stock_per_trade: 40
  #   stock_pct: 0.03
  #   stock_slippage_pct: 0.03
  portfolio:
    enabled: true
    require_take_grade: true
    max_open_positions: 5
    max_open_positions_per_symbol: 1
    max_total_open_risk: 2500  # strategy desk's own stricter risk ceiling
    max_daily_loss: 1500       # strategy desk's own stricter realised-loss ceiling
  execution:
    entry_mode: next_open      # next_open = after the signal candle closes; signal_close is optimistic
  # params:                    # change one number of one strategy, for example:
  #   momentum: {stock: {rsi: 65}}

# Backtest: only used when you run the Backtest workflow. Leave as it is unless you want to
# test other assumptions. These are estimates of what trading really costs you.
# backtest:
#   option_cost_per_trade: 100     # rupees per option trade (brokerage, taxes, fees)
#   option_slippage_pct: 0.5       # % of the option price lost on each of buying and selling
#   stock_cost_per_trade: 40
#   stock_cost_pct: 0.03
#   stock_slippage_pct: 0.03
#   iv:                            # how expensive options are assumed to be (13% = 0.13)
#     NIFTY: 0.13
