name: Trade engine

# GitHub's timer knocks every 10 minutes during market hours (India time:
# about 8:30 am to 3:30 pm and 4:30 pm to 11:30 pm, weekdays). If the engine is
# already awake, the new run leaves within a few seconds. If the engine has
# stopped for any reason, the new run takes over from where it left off.
# You can also start it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "*/10 3-9 * * 1-5"
    - cron: "*/10 11-17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Open the data folder
        run: |
          git config --global user.name "signal-desk"
          git config --global user.email "signal-desk@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data > /dev/null; then
            git clone --quiet --depth 3 --branch data --single-branch "$REMOTE" _data
          else
            mkdir _data && cd _data && git init --quiet -b data && git remote add origin "$REMOTE"
          fi

      # A quick look before installing anything: if another run checked in
      # within the last 5 minutes, this one has nothing to do.
      - name: Is the engine already awake?
        id: awake
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime, os
          go = "yes"
          try:
              s = json.load(open("_data/feed.json"))["status"]
              age = (datetime.datetime.now(datetime.timezone.utc)
                     - datetime.datetime.fromisoformat(s["heartbeat"])).total_seconds()
              if s.get("running") and age < 300 and os.environ.get("GITHUB_EVENT_NAME") == "schedule":
                  go = "no"
          except Exception:
              pass
          print(f"go={go}")
          PY

      - uses: actions/setup-python@v5
        if: steps.awake.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.awake.outputs.go == 'yes'
        run: pip install --quiet -r requirements.txt

      - name: Run the engine
        if: steps.awake.outputs.go == 'yes'
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -m engine.run
