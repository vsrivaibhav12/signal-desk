name: CI

# Every push and pull request must pass the offline tests, the contract checks and the dashboard build before it is merged.
# Nothing here needs a broker login or any secret.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --quiet -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q engine tests
      - name: Tests (engine, research, contract)
        run: |
          status=0
          python -m pytest -q -p no:cacheprovider --junitxml=report.xml || status=$?
          # List any failing tests as annotations, so the run's summary page says which failed and why.
          python tests/ci_report.py report.xml
          exit $status

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types (generated from the contract schemas)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
