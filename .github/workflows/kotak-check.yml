name: Kotak check

# Run by hand from the Actions tab: choose "Kotak check", press "Run workflow".
# It tests the Kotak Neo connection against your own account: the consumer key, the share and index names,
# prices, 5-minute history, futures and an option. It sends nothing and places no order.
# Takes about two minutes. If a line says FAIL, copy the output and send it back.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Check Kotak Neo
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m engine.kotak --check
