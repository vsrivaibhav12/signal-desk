name: Dashboard

# Builds the new dashboard (web/) on every change and, once you have switched GitHub Pages to "GitHub Actions" and set the repository
# variable PAGES_FROM_ACTIONS to true (see docs/upgrades/UPGRADE_5.0.0.md), publishes it. Until then this only checks that it builds, and
# your existing Pages setup carries on serving the old dashboard. The old dashboard is kept at /legacy/ on the new site.
on:
  push:
    branches: [main]
    paths: ["web/**", "contract/**", "index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, type-check, test and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Keep the previous dashboard available at /legacy/
        run: |
          mkdir -p web/dist/legacy
          cp index.html web/dist/legacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: vars.PAGES_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
