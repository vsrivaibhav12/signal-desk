<title>Signal Desk</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E8F0; --line:#D3D9E6;
  --ink:#17203A; --muted:#566080;
  --gain:#0A7F5B; --gain-soft:#DDF3EA; --loss:#C2362B; --loss-soft:#FAE3E0;
  --live:#B97F00; --live-soft:#FBEFCF; --accent:#2B3F8C;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1427; --surface:#161E38; --sunk:#1D2747; --line:#2B3659;
    --ink:#E9EDF8; --muted:#9AA6C6;
    --gain:#43D6A4; --gain-soft:#12392F; --loss:#FF8272; --loss-soft:#44201F;
    --live:#F2BC45; --live-soft:#3D3115; --accent:#9DB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1427; --surface:#161E38; --sunk:#1D2747; --line:#2B3659;
  --ink:#E9EDF8; --muted:#9AA6C6;
  --gain:#43D6A4; --gain-soft:#12392F; --loss:#FF8272; --loss-soft:#44201F;
  --live:#F2BC45; --live-soft:#3D3115; --accent:#9DB0FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700;margin:44px 0 14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 1.15rem var(--display)}
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--gain);box-shadow:0 0 0 0 var(--gain);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--live-soft);color:var(--ink);font-size:.93rem;border:1px solid var(--live)}
.lead{font:700 clamp(1.7rem,5.2vw,2.7rem)/1.12 var(--display);margin:30px 0 4px;max-width:20ch}
.sublead{color:var(--muted);max-width:60ch;margin:0}

/* trade card with ladder */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.open-card{border-left:5px solid var(--live);margin-bottom:14px}
.open-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.open-head h3{font-size:1.2rem}
.pnl-now{font:700 1.5rem var(--display)}
.pnl-box{text-align:right}
@media (max-width:560px){.pnl-box{text-align:left}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin:16px 0 0}
.facts div{font-size:.86rem;color:var(--muted)}
.facts b{display:block;color:var(--ink);font:600 1.02rem var(--body);font-variant-numeric:tabular-nums}
.ladder{position:relative;height:62px;margin:22px 14px 6px}
.ladder .rail{position:absolute;left:0;right:0;top:10px;height:8px;border-radius:4px;background:var(--sunk)}
.ladder .fill{position:absolute;top:10px;height:8px;border-radius:4px}
.ladder .tick{position:absolute;top:4px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.ladder .tick.stop{background:var(--loss)} .ladder .tick.target{background:var(--gain)}
.ladder .lab{position:absolute;top:30px;font-size:.78rem;color:var(--muted);white-space:nowrap;transform:translateX(-50%);text-align:center;line-height:1.25}
.ladder .lab b{display:block;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.ladder .lab.first{transform:none;text-align:left} .ladder .lab.last{transform:translateX(-100%);text-align:right}
.ladder .mark{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;border:3px solid var(--surface);transform:translateX(-11px);box-shadow:0 1px 4px rgba(10,20,50,.35)}
.why{margin:16px 0 0;padding:0;list-style:none}
.why li{position:relative;padding:3px 0 3px 26px;font-size:.95rem}
.why li::before{content:"";position:absolute;left:4px;top:9px;width:10px;height:6px;border-left:2.5px solid var(--gain);border-bottom:2.5px solid var(--gain);transform:rotate(-45deg)}
.subhead{font:600 .95rem var(--body);margin:18px 0 2px}

/* today tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile.busy{border-color:var(--live);background:var(--live-soft)}
.tile.done{background:transparent}
.tile h3{font-size:1.02rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tile h3 span{font:500 .95rem var(--body);font-variant-numeric:tabular-nums}
.tile p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.tile .levels{font-size:.8rem;margin-top:8px;font-variant-numeric:tabular-nums}

/* record */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.record{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
@media (max-width:820px){.record{grid-template-columns:minmax(0,1fr)}}
.record>.card{min-width:0}
.rate{font:700 clamp(3.2rem,11vw,4.6rem)/1 var(--display)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:14px 0 8px}
.split i{display:block;height:100%} .split .w{background:var(--gain)} .split .l{background:var(--loss)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin-top:18px}
.stats div{font-size:.84rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font:600 1.1rem var(--body);font-variant-numeric:tabular-nums}
.curve svg{display:block;width:100%;height:190px}
.curve-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.total{font:700 1.7rem var(--display)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-weight:500;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0}

/* trade log */
.day-label{font:600 .92rem var(--body);color:var(--muted);margin:20px 0 8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.row>button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.pill{font:600 .78rem var(--body);padding:3px 10px;border-radius:999px;min-width:52px;text-align:center}
.pill.WIN{background:var(--gain-soft);color:var(--gain)} .pill.LOSS{background:var(--loss-soft);color:var(--loss)}
.pill.OPEN{background:var(--live-soft);color:var(--live)} .pill.FLAT{background:var(--sunk);color:var(--muted)}
.row .what{font-weight:600;min-width:0}
.row .what small{display:block;font-weight:400;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .res{text-align:right;font:700 1.02rem var(--display);font-variant-numeric:tabular-nums}
.row .res small{display:block;font:400 .8rem var(--body);color:var(--muted)}
.detail{padding:2px 16px 18px;border-top:1px solid var(--line)}
.timeline{list-style:none;margin:8px 0 0;padding:0;font-size:.92rem}
.timeline li{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:4px 0}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums}
.more{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
details.log{margin-top:40px} details.log summary{cursor:pointer;font:700 1.1rem var(--display)}

/* login helper */
.login{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{max-width:440px}
.big{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font-weight:600;font-size:1.05rem;text-align:center;text-decoration:none}
.big.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
footer{margin-top:44px;font-size:.84rem;color:var(--muted)}
</style>
</head>

const LIVE = location.hostname.endsWith("github.io");
const state = { feed: null, book: "All", period: "all", open: new Set(), shown: 25, error: null };

const inr = (x, d = 2) => Number(x).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const rupee = x => (x < 0 ? "−" : "") + "₹" + inr(Math.abs(x), Math.abs(x) >= 1000 ? 0 : 2);
const signed = x => (x > 0 ? "+" : x < 0 ? "−" : "") + "₹" + inr(Math.abs(x), Math.abs(x) >= 1000 ? 0 : 2);
const cls = x => (x > 0 ? "gain" : x < 0 ? "loss" : "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Times in the feed are already India time, so read the clock straight from the text.
const hhmm = iso => { if (!iso) return ""; let h = +iso.slice(11, 13), m = iso.slice(14, 16); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}:${m} ${ap}`; };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayText = d => { const dt = new Date(d + "T00:00:00"); return `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()]}, ${+d.slice(8)} ${MONTHS[+d.slice(5, 7) - 1]}`; };
const clock24 = t => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "pm" : "am"}`; };

async function load() {
  if (!LIVE) { state.feed = DEMO; return; }
  const owner = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  const tries = [
    [`https://api.github.com/repos/${owner}/${repo}/contents/feed.json?ref=data`, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" }],
    [`https://raw.githubusercontent.com/${owner}/${repo}/data/feed.json?t=${Date.now()}`, { cache: "no-store" }],
  ];
  let missing = false;
  for (const [url, opt] of tries) {
    try {
      const r = await fetch(url, opt);
      if (r.ok) { state.feed = await r.json(); state.error = null; return; }
      if (r.status === 404) missing = true;
    } catch (e) { /* try the next address */ }
  }
  if (!state.feed) state.error = missing ? "none-yet" : "unreachable";
}

function filtered() {
  let t = state.feed.trades || [];
  if (state.book !== "All") t = t.filter(x => x.book === state.book);
  if (state.period !== "all") {
    const cut = new Date(Date.now() - (+state.period) * 864e5).toISOString().slice(0, 10);
    t = t.filter(x => x.date >= cut);
  }
  return t;
}

function ladder(t) {
  const stop = t.stop_underlying, target = t.target_underlying, entry = t.underlying_entry;
  const now = t.underlying_last ?? entry;
  const pos = x => Math.max(-2, Math.min(102, (x - stop) / (target - stop) * 100));
  const pe = pos(entry), pn = pos(now);
  const good = pn >= pe;
  const lo = Math.max(0, Math.min(pe, pn)), hi = Math.min(100, Math.max(pe, pn));
  const closed = t.status === "CLOSED";
  const markColor = closed ? (t.result === "WIN" ? "var(--gain)" : t.result === "LOSS" ? "var(--loss)" : "var(--muted)") : "var(--live)";
  return `<div class="ladder" role="img" aria-label="Stop ${inr(stop)}, entry ${inr(entry)}, target ${inr(target)}, ${closed ? "ended" : "now"} at ${inr(now)}">
    <div class="rail"></div>
    <div class="fill" style="left:${lo}%;width:${hi - lo}%;background:${good ? "var(--gain)" : "var(--loss)"}"></div>
    <div class="tick stop" style="left:0"></div><div class="tick" style="left:${pe}%"></div><div class="tick target" style="left:100%"></div>
    <div class="mark" style="left:${Math.max(0, Math.min(100, pn))}%;background:${markColor}"></div>
    <div class="lab first" style="left:0">Stop<b>${inr(stop)}</b></div>
    <div class="lab" style="left:${Math.max(22, Math.min(78, pe))}%">Entry<b>${inr(entry)}</b></div>
    <div class="lab last" style="left:100%">Target<b>${inr(target)}</b></div>
  </div>`;
}

const why = t => `<p class="subhead">Why this trade was triggered</p><ul class="why">${t.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
const levelName = t => t.kind === "option" ? `${esc(t.name)} level` : "Share price";

function openCard(t) {
  const p = t.open_pnl ?? 0;
  const stopText = t.kind === "option"
    ? `₹${inr(t.stop_price)} on the option, or ${esc(t.name)} closing a 5-minute candle past ${inr(t.stop_underlying)}`
    : `${esc(t.name)} closing a 5-minute candle past ₹${inr(t.stop_underlying)}`;
  return `<article class="card open-card">
    <div class="open-head">
      <div><h3>${esc(t.headline)}</h3><div class="muted">${esc(t.name)}, entered ${hhmm(t.entry_time)}${t.phase === "trail" ? ", half booked and now trailing" : ""}</div></div>
      <div class="pnl-box"><div class="pnl-now num ${cls(p)}">${signed(p)}</div><div class="muted" style="font-size:.84rem">so far, as of ${hhmm(t.last_update)}</div></div>
    </div>
    <div class="muted" style="font-size:.84rem;margin-top:14px">${levelName(t)}: where it stands between the stop and the target</div>
    ${ladder(t)}
    <div class="facts">
      <div>Entry price<b>₹${inr(t.entry_price)}</b></div>
      <div>Price now<b>₹${inr(t.last_price)}</b></div>
      <div>Quantity<b>${t.kind === "option" ? `${t.lots} lot${t.lots > 1 ? "s" : ""} (${inr(t.qty)})` : inr(t.qty) + " shares"}</b></div>
      <div>Planned risk<b>${rupee(t.risk_amount)}</b></div>
      <div>Exit by<b>${clock24(t.exit_by)}</b></div>
    </div>
    <p class="subhead">Stop-loss</p><div>${t.phase === "trail" ? `Moved to the entry price (₹${inr(t.entry_price)}) after the target was reached. The rest also exits if price closes back across the average price line.` : stopText}</div>
    <p class="subhead">Target</p><div>${t.kind === "option" ? esc(t.name) + " at " : "₹"}${inr(t.target_underlying)}${t.phase === "trail" ? ". Reached, and half is already booked." : ""}</div>
    ${why(t)}
  </article>`;
}

function tile(x) {
  const levels = x.range_high ? `<div class="levels muted">Range ${inr(x.range_low)} to ${inr(x.range_high)}${x.vwap ? `<br>Average price line ${inr(x.vwap)}` : ""}${x.prev_close ? `<br>Yesterday’s close ${inr(x.prev_close)}` : ""}</div>` : "";
  return `<div class="tile ${x.in_trade ? "busy" : x.done ? "done" : ""}">
    <h3>${esc(x.name)}${x.price ? `<span>${inr(x.price)}</span>` : ""}</h3>
    <p>${esc(x.note || "Waiting")}</p>${levels}</div>`;
}

function stats(tr) {
  const c = tr.filter(t => t.status === "CLOSED");
  const w = c.filter(t => t.result === "WIN"), l = c.filter(t => t.result === "LOSS");
  const sum = a => a.reduce((s, t) => s + t.pnl, 0);
  const gw = sum(w), gl = Math.abs(sum(l));
  let eq = 0, peak = 0, dd = 0; const curve = [0];
  c.forEach(t => { eq += t.pnl; curve.push(eq); peak = Math.max(peak, eq); dd = Math.max(dd, peak - eq); });
  return { n: c.length, w: w.length, l: l.length, flat: c.length - w.length - l.length,
    rate: w.length + l.length ? w.length / (w.length + l.length) * 100 : null,
    total: eq, avgW: w.length ? gw / w.length : 0, avgL: l.length ? gl / l.length : 0,
    pf: gl ? gw / gl : null, avgR: c.length ? c.reduce((s, t) => s + (t.r || 0), 0) / c.length : 0, dd, curve };
}

function curveSvg(pts) {
  if (pts.length < 2) return `<div class="empty">The profit line appears after the first closed trade.</div>`;
  const W = 600, H = 190, pad = 8, min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1;
  const x = i => pad + i / (pts.length - 1) * (W - 2 * pad), y = v => H - pad - (v - min) / span * (H - 2 * pad);
  const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const up = pts[pts.length - 1] >= 0, col = up ? "var(--gain)" : "var(--loss)";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Running total of profit and loss, trade by trade">
    <polygon points="${x(0)},${y(0)} ${line} ${x(pts.length - 1)},${y(0)}" fill="${col}" opacity=".12"/>
    <line x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function record(tr) {
  const s = stats(tr);
  const chip = (k, v, label) => `<button class="chip" data-${k}="${v}" aria-pressed="${state[k] === v}">${label}</button>`;
  const filters = `<div class="filters" role="group" aria-label="Filter the record">
    ${["All", "Index options", "Commodity options", "Stocks"].map(b => chip("book", b, b === "All" ? "All markets" : b)).join("")}
    <span style="width:10px"></span>
    ${[["all", "All time"], ["30", "Last 30 days"], ["7", "Last 7 days"]].map(([v, l]) => chip("period", v, l)).join("")}</div>`;
  if (!s.n) return filters + `<div class="empty">No closed trades in this view yet. The record fills in as the tool’s suggestions reach their stop, target or exit time.</div>`;
  const by = {};
  tr.filter(t => t.status === "CLOSED").forEach(t => { (by[t.book === "Stocks" ? "Stocks" : t.name] ||= []).push(t); });
  const rows = Object.entries(by).map(([k, v]) => { const m = stats(v); return `<tr><td>${esc(k)}</td><td>${m.n}</td><td>${m.w}</td><td>${m.l}</td><td>${m.rate === null ? "" : m.rate.toFixed(0) + "%"}</td><td class="${cls(m.total)}">${signed(m.total)}</td></tr>`; }).join("");
  const decided = s.w + s.l;
  return filters + `<div class="record">
    <div class="card">
      <div class="muted">Win rate</div>
      <div class="rate num">${s.rate === null ? "n/a" : s.rate.toFixed(0) + "%"}</div>
      <div class="split" aria-hidden="true"><i class="w" style="width:${decided ? s.w / decided * 100 : 0}%"></i><i class="l" style="width:${decided ? s.l / decided * 100 : 0}%"></i></div>
      <div><b class="gain">${s.w} won</b>, <b class="loss">${s.l} lost</b>${s.flat ? `, ${s.flat} flat` : ""} out of ${s.n} closed trades</div>
      ${s.n < 30 ? `<p class="note">Fewer than 30 trades so far, so this number will still swing a lot.</p>` : ""}
      <div class="stats">
        <div>Average win<b class="gain">${rupee(s.avgW)}</b></div>
        <div>Average loss<b class="loss">${rupee(s.avgL)}</b></div>
        <div>Rupees won per rupee lost<b>${s.pf === null ? "n/a" : s.pf.toFixed(2)}</b></div>
        <div>Average result per trade<b>${s.avgR >= 0 ? "+" : "−"}${Math.abs(s.avgR).toFixed(2)}R</b></div>
        <div>Deepest dip from a peak<b>${rupee(s.dd)}</b></div>
        <div>Trades counted<b>${s.n}</b></div>
      </div>
      <p class="note">R means the result compared with the planned risk: +1R is a win as big as the amount risked.</p>
    </div>
    <div class="card curve">
      <div class="curve-head"><div class="muted">Running total, trade by trade</div><div class="total num ${cls(s.total)}">${signed(s.total)}</div></div>
      ${curveSvg(s.curve)}
      <div class="scroll"><table><thead><tr><th>Market</th><th>Trades</th><th>Won</th><th>Lost</th><th>Win rate</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div></div>`;
}

function tradeRow(t) {
  const isOpen = state.open.has(t.id);
  const status = t.status === "OPEN" ? "OPEN" : t.result;
  const pnl = t.status === "OPEN" ? (t.open_pnl ?? 0) : t.pnl;
  const sub = t.status === "OPEN" ? `Entered ${hhmm(t.entry_time)} at ₹${inr(t.entry_price)}, still open`
    : `${hhmm(t.entry_time)} at ₹${inr(t.entry_price)} to ${hhmm(t.exit_time)} at ₹${inr(t.exit_price)}. ${esc(t.exit_reason)}`;
  let detail = "";
  if (isOpen) {
    detail = `<div class="detail">
      <div class="muted" style="font-size:.84rem;margin-top:14px">${levelName(t)} between the stop and the target</div>${ladder(t)}
      <div class="facts">
        <div>Entry price<b>₹${inr(t.entry_price)}</b></div>
        <div>${t.status === "OPEN" ? "Price now" : "Exit price"}<b>₹${inr(t.status === "OPEN" ? t.last_price : t.exit_price)}</b></div>
        ${t.kind === "option" ? `<div>Option stop-loss<b>₹${inr(t.entry_price * (1 - t.stop_pct / 100))} (${t.stop_pct}% below entry)</b></div>` : ""}
        <div>Quantity<b>${t.kind === "option" ? `${t.lots} lot${t.lots > 1 ? "s" : ""} (${inr(t.qty)})` : inr(t.qty) + " shares"}</b></div>
        <div>Planned risk<b>${rupee(t.risk_amount)}</b></div>
        <div>Opening range<b>${inr(t.range_low)} to ${inr(t.range_high)}</b></div>
      </div>
      ${why(t)}
      <p class="subhead">What happened</p>
      <ol class="timeline">${t.events.map(e => `<li><time>${hhmm(e.t)}</time><span>${esc(e.text)}</span></li>`).join("")}</ol>
    </div>`;
  }
  return `<div class="row"><button data-trade="${esc(t.id)}" aria-expanded="${isOpen}">
      <span class="pill ${status}">${status === "WIN" ? "Won" : status === "LOSS" ? "Lost" : status === "OPEN" ? "Open" : "Flat"}</span>
      <span class="what">${esc(t.headline)}<small>${sub}</small></span>
      <span class="res ${cls(pnl)}">${signed(pnl)}<small>${t.status === "CLOSED" ? (t.r >= 0 ? "+" : "−") + Math.abs(t.r).toFixed(2) + "R" : "so far"}</small></span>
    </button>${detail}</div>`;
}

function tradeLog(tr) {
  if (!tr.length) return `<div class="empty">No trades in this view yet. When a setup passes every rule, it appears here with its entry, stop-loss, target and the reasons it was triggered.</div>`;
  const list = [...tr].reverse(), shown = list.slice(0, state.shown);
  let html = "", last = "";
  shown.forEach(t => { if (t.date !== last) { html += `<div class="day-label">${dayText(t.date)}</div>`; last = t.date; } html += tradeRow(t); });
  if (list.length > shown.length) html += `<button class="more" id="more">Show ${Math.min(25, list.length - shown.length)} more of ${list.length - shown.length} older trades</button>`;
  return html;
}

function render() {
  const app = document.getElementById("app"), pulse = document.getElementById("pulse"), banner = document.getElementById("banner");
  banner.innerHTML = LIVE ? "" : `<div class="banner"><b>Sample data.</b> These trades are made up by a test run to show how the page looks. Your real trades appear once the tool is set up and running.</div>`;
  if (!state.feed) {
    pulse.innerHTML = `<span class="dot"></span><span>Not connected</span>`;
    app.innerHTML = state.error === "none-yet"
      ? `<p class="lead">Nothing to show yet.</p><p class="sublead">The engine has not run for the first time. Open your GitHub page, go to Actions, choose Trade engine, and press Run workflow. This page fills in a minute after it starts.</p>`
      : `<p class="lead">Could not reach the trade data.</p><p class="sublead">Check your internet connection. This page tries again by itself every 90 seconds.</p>`;
    return;
  }
  const st = state.feed.status || {}, all = state.feed.trades || [];
  const open = all.filter(t => t.status === "OPEN");
  const tiles = st.tiles || [];
  const fresh = st.updated && (!LIVE || Date.now() - new Date(st.updated).getTime() < 8 * 60e3);
  const running = st.running && fresh;
  pulse.innerHTML = `<span class="dot ${running ? "on" : ""}"></span><span>${running ? "Watching now" : "Resting"}${st.updated ? `, last checked ${hhmm(st.updated)}${st.day && st.day.date !== new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }) && LIVE ? " on " + dayText(st.day.date) : ""}` : ""}</span>`;
  const today = st.day ? all.filter(t => t.date === st.day.date) : [];
  const closedToday = today.filter(t => t.status === "CLOSED");
  const todayPnl = closedToday.reduce((s, t) => s + t.pnl, 0);
  const lead = open.length ? `${open.length} trade${open.length > 1 ? "s" : ""} open right now.`
    : running ? "No open trade. Watching for a setup." : "Markets are resting. Nothing open.";
  const sub = `${today.length ? `${today.length} trade${today.length > 1 ? "s" : ""} triggered today` : "No trade triggered today"}${closedToday.length ? `, ${closedToday.length} closed for ${signed(todayPnl)}` : ""}. ${st.day && st.day.skip ? "New trades are paused for today." : ""}`;
  const tr = filtered();
  const log = (st.day && st.day.log || []).slice().reverse();
  app.innerHTML = `
    <p class="lead">${lead}</p><p class="sublead">${sub}</p>
    ${open.length ? `<h2>Open trades</h2>${open.map(openCard).join("")}` : ""}
    <h2>Today’s markets</h2>
    ${tiles.length ? `<div class="tiles">${tiles.map(tile).join("")}</div>` : `<div class="empty">The market list appears when the engine starts its next session.</div>`}
    <h2>The tool’s record</h2>${record(tr)}
    <h2>Every trade it triggered</h2>${tradeLog(tr)}
    <details class="log"><summary>Today’s activity log</summary>
      ${log.length ? `<ol class="timeline">${log.map(e => `<li><time>${hhmm(e.t)}</time><span>${esc(e.text)}</span></li>`).join("")}</ol>` : `<p class="muted">Nothing logged yet today.</p>`}
    </details>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.trade) { const id = b.dataset.trade; state.open.has(id) ? state.open.delete(id) : state.open.add(id); }
  else if (b.dataset.book) { state.book = b.dataset.book; state.shown = 25; }
  else if (b.dataset.period) { state.period = b.dataset.period; state.shown = 25; }
  else if (b.id === "more") state.shown += 25;
  else return;
  const y = scrollY; render(); scrollTo(0, y);
});

// After a Fyers login the browser lands here with a login code. Help the user hand it to the bot.
function loginHelper() {
  const code = new URLSearchParams(location.search).get("auth_code");
  if (!code) return;
  const bot = state.feed && state.feed.status && state.feed.status.bot;
  const box = document.getElementById("login");
  box.innerHTML = `<div class="login"><div class="card">
    <h2 style="margin:0 0 8px">Fyers login worked</h2>
    <p>One step left: give this login code to your Telegram bot so the tool can read prices.</p>
    <button class="big" id="copy">Copy login code</button>
    ${bot ? `<a class="big alt" href="https://t.me/${esc(bot)}">Open my Telegram bot</a>` : ""}
    <p class="muted" style="font-size:.9rem;margin-bottom:0">In Telegram, paste the code as a message and send it. The code works only for a few minutes.</p>
    <button class="big alt" id="skip">Go to the dashboard</button></div></div>`;
  document.getElementById("copy").onclick = async ev => {
    try { await navigator.clipboard.writeText(code); ev.target.textContent = "Copied. Now paste it in Telegram"; }
    catch (err) { prompt("Copy this code and paste it in Telegram:", code); }
  };
  document.getElementById("skip").onclick = () => { history.replaceState(null, "", location.pathname); box.innerHTML = ""; };
}

(async function start() {
  await load(); render(); loginHelper();
  if (LIVE) setInterval(async () => { await load(); render(); }, 90000);
})();
</script>
</body>
</html>
